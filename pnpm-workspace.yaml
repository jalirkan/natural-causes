# pnpm 11 reads build-script approval from here, not from package.json.
# The file was generated by pnpm with both entries unset; they are answered
# here so an unattended install never stops to ask.
#
#   esbuild  Vite's bundler — postinstall links the platform binary
#   sharp    the art pipeline's image library (ART-DIRECTION.md steps 2-5)
#
# Both are direct dependencies we chose on purpose, so both are allowed.
allowBuilds:
  esbuild: true
  sharp: true
