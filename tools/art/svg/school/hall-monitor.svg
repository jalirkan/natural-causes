<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    Hall monitor (SCHOOL-ROSTER §3.4). A generic, squarely standing pictogram
    lump in elite purple, crossed by one wide hard diagonal band from the
    left shoulder to the right hip. The band is drawn long and clipped by the
    torso, so it runs off both edges and is cut by them: a stripe, never a
    slab, badge or tag (§1 — the bright hard rectangle is the substitute's).
    The sash is the character (law 9); the lump only carries it. Face: two
    dots and a flat line, turned along its route, not at the player (law 8).
    No hair, no skin tone, no features beyond the face (D-007).
    Olive legs keep the purple under 40% of the sprite, which the contrast
    check against school-deep requires (purple sits 0.11 L from it).
    CONFORM adds the outline; there is none here.
    Colours are palette hex values: threat-elite #7C5C8A, bone #D2C6AC,
    school-mid #6B7F53, ink #2A2521.
  -->
  <defs>
    <clipPath id="torso">
      <path d="M 8 58 Q 8 40 26 40 L 74 40 Q 92 40 92 58 L 87 74 Q 86 80 81 80 L 19 80 Q 14 80 13 74 Z"/>
    </clipPath>
  </defs>
  <!-- legs, stubby, tucked under the torso -->
  <rect x="19" y="74" width="26" height="24" rx="4" fill="#6B7F53"/>
  <rect x="55" y="74" width="26" height="24" rx="4" fill="#6B7F53"/>
  <!-- torso -->
  <path d="M 8 58 Q 8 40 26 40 L 74 40 Q 92 40 92 58 L 87 74 Q 86 80 81 80 L 19 80 Q 14 80 13 74 Z" fill="#7C5C8A"/>
  <!-- the sash: 35 degrees, 28 wide, cut off by the torso on both sides -->
  <polygon points="10.6,11.7 108.9,80.5 92.8,103.4 -5.5,34.6" fill="#D2C6AC" clip-path="url(#torso)"/>
  <!-- head: a rounded lump, not a circle (the circle is the dodgeball's) -->
  <rect x="32" y="6" width="36" height="30" rx="15" fill="#7C5C8A"/>
  <!-- face, looking along its route -->
  <circle cx="52" cy="19" r="3.8" fill="#2A2521"/>
  <circle cx="62.5" cy="19" r="3.8" fill="#2A2521"/>
  <rect x="51" y="27" width="13" height="3.4" fill="#2A2521"/>
</svg>
