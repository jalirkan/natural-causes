<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Hall monitor</title>
  <desc>A round-headed figure in kid proportions and an elite-purple sweater crossed by one wide bone sash from shoulder to hip, stubby arms with mitten hands, looking pleased and off along its route rather than at the viewer.</desc>
  <!--
    Hall monitor (SCHOOL-ROSTER section 3.4), in the greeting-card register
    (ART-DIRECTION section 2026-09-28, G-053). Kid proportions: a big head,
    a small round body, stubby arms and legs, mitten hands.

    Silhouette (law 11): the sash. One wide hard diagonal band from the left
    shoulder to the right hip, drawn long and clipped by the round body, so
    it runs off both edges and is cut by them: a stripe, never a slab, badge
    or tag (the bright hard rectangle is the substitute's). It is the only
    hard diagonal in the act. The sash is the character (law 9); the figure
    only carries it.

    Colour (law 6): elite purple on the body, which School's reservation
    holds for the hall monitor alone. Purple sits 0.11 L from school-deep,
    so the green head, the bone sash and the ink legs keep it under the
    contrast check's share. The head is the act's mid green, the way School
    draws a person: no hair (the cowlick is the player's), no features
    beyond the face (D-007). The face looks along its route, not at the
    player: two big ink eyes with one bone glint each, blush, a small
    pleased mouth, the pleasure of a small authority. One bone glint on the
    head and one on the body, upper left, never paper (law 10).
    CONFORM adds the outline; there is none here and no strokes, and the
    gaps between head, body and arms close into it. Colours: threat-elite
    #7C5C8A, bone #D2C6AC, school-mid #6B7F53, ink #2A2521, blush #EBA39C.
  -->
  <defs>
    <clipPath id="torso">
      <path d="M27,60 Q27,49 40,49 L60,49 Q73,49 73,60 L74,76 Q74,87 63,87 L37,87 Q26,87 26,76 Z"/>
    </clipPath>
  </defs>
  <!-- stubby legs -->
  <rect x="33" y="82" width="12" height="15" rx="5.5" fill="#2A2521"/>
  <rect x="55" y="82" width="12" height="15" rx="5.5" fill="#2A2521"/>
  <!-- stubby arms, sleeves and mittens -->
  <rect x="15" y="53" width="9" height="18" rx="4.5" transform="rotate(15 19.5 62)" fill="#7C5C8A"/>
  <rect x="76" y="53" width="9" height="18" rx="4.5" transform="rotate(-15 80.5 62)" fill="#7C5C8A"/>
  <ellipse cx="16.4" cy="71.4" rx="4.7" ry="4.5" fill="#6B7F53"/>
  <ellipse cx="83.6" cy="71.4" rx="4.7" ry="4.5" fill="#6B7F53"/>
  <!-- the body -->
  <path d="M27,60 Q27,49 40,49 L60,49 Q73,49 73,60 L74,76 Q74,87 63,87 L37,87 Q26,87 26,76 Z" fill="#7C5C8A"/>
  <!-- the body's one glint, on the purple above the sash -->
  <ellipse cx="47" cy="54" rx="2.2" ry="1.5" transform="rotate(-30 47 54)" fill="#D2C6AC"/>
  <!-- the sash: 32 degrees, 16 wide, cut off by the body on both sides -->
  <polygon points="17.5,39.3 91,85.2 82.5,98.7 9,52.8" fill="#D2C6AC" clip-path="url(#torso)"/>
  <!-- head: a big rounded lump, wider than tall (the circle is the dodgeball's) -->
  <ellipse cx="50" cy="25" rx="25" ry="22" fill="#6B7F53"/>
  <!-- the head's one glint -->
  <ellipse cx="34" cy="11.5" rx="2.6" ry="1.8" transform="rotate(-40 34 11.5)" fill="#D2C6AC"/>
  <!-- face, turned along its route -->
  <ellipse cx="53" cy="27.5" rx="5" ry="6" fill="#2A2521"/>
  <ellipse cx="66" cy="27.5" rx="5" ry="6" fill="#2A2521"/>
  <circle cx="51.2" cy="25" r="1.9" fill="#D2C6AC"/>
  <circle cx="64.2" cy="25" r="1.9" fill="#D2C6AC"/>
  <ellipse cx="46" cy="37" rx="4" ry="2.5" fill="#EBA39C"/>
  <ellipse cx="67" cy="37" rx="3.8" ry="2.5" fill="#EBA39C"/>
  <path d="M55.8,36.2 Q59.5,42 63.2,36.2 Q59.5,38.8 55.8,36.2 Z" fill="#2A2521"/>
</svg>
