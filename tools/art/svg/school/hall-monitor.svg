<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Hall monitor</title>
  <desc>A plain upright pictogram figure crossed by one hard diagonal sash that runs off both sides of the body.</desc>
  <defs>
    <clipPath id="body"><path d="M28 40 L72 40 L76 84 L60 84 L60 98 L52 98 L52 86 L48 86 L48 98 L40 98 L40 84 L24 84 Z"/></clipPath>
  </defs>
  <path d="M28 40 L72 40 L76 84 L60 84 L60 98 L52 98 L52 86 L48 86 L48 98 L40 98 L40 84 L24 84 Z" fill="#6B7F53"/>
  <!-- The sash: cut off by the body's own edges, so it is a stripe, never a badge. -->
  <polygon points="10,30 30,30 90,90 70,90" fill="#D2C6AC" clip-path="url(#body)"/>
  <circle cx="50" cy="22" r="17" fill="#D2C6AC"/>
  <!-- Looking along its route, off to the left. -->
  <ellipse cx="42" cy="21" rx="2.6" ry="4" fill="#2A2521"/>
  <ellipse cx="50" cy="21" rx="2.6" ry="4" fill="#2A2521"/>
  <rect x="41" y="30" width="8" height="2.6" rx="1.2" fill="#2A2521"/>
</svg>
