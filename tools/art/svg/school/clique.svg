<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <title>Clique</title>
  <desc>One fused lumpy body with four heads, all wearing the same face and looking the same way.</desc>
  <!-- One body. The heads grow out of it; there is no gap to walk through. -->
  <path d="M6 98 C4 72 10 56 20 50 L100 50 C110 56 116 72 114 98 Z" fill="#6B7F53"/>
  <path d="M6 98 C5 86 7 80 10 76 L110 76 C113 80 115 86 114 98 Z" fill="#6E6353"/>
  <circle cx="24" cy="42" r="17" fill="#D2C6AC"/>
  <circle cx="50" cy="34" r="17" fill="#D2C6AC"/>
  <circle cx="75" cy="39" r="17" fill="#D2C6AC"/>
  <circle cx="98" cy="45" r="16" fill="#D2C6AC"/>
  <!-- The same face four times, all turned to the right. -->
  <g fill="#2A2521">
    <ellipse cx="27" cy="40" rx="2.6" ry="4"/><ellipse cx="35" cy="40" rx="2.6" ry="4"/><rect x="28" y="49" width="7" height="2.6" rx="1.2"/>
    <ellipse cx="53" cy="32" rx="2.6" ry="4"/><ellipse cx="61" cy="32" rx="2.6" ry="4"/><rect x="54" y="41" width="7" height="2.6" rx="1.2"/>
    <ellipse cx="78" cy="37" rx="2.6" ry="4"/><ellipse cx="86" cy="37" rx="2.6" ry="4"/><rect x="79" y="46" width="7" height="2.6" rx="1.2"/>
    <ellipse cx="101" cy="43" rx="2.6" ry="4"/><ellipse cx="108" cy="43" rx="2.6" ry="4"/><rect x="101" y="52" width="7" height="2.6" rx="1.2"/>
  </g>
</svg>
