<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player at school age</title>
  <desc>A small chubby child standing with its arms a little out: a big round head with the one cowlick above the left eye, two big dark eyes with a light glint each, blush on both cheeks and a small content smile, mitten hands and short round legs.</desc>
  <!--
    The player (G-003, G-053; ART-DIRECTION §2026-09-28, rule 6). The base
    geometry every later act reuses: the head group below is copied verbatim
    into all seven player drawings, and the figure spans the same height in
    every one (the cowlick's tip to the feet), so the head is drawn at the
    same size and height in every act. The costume grows; the person does not.
    Not taller: taller is Growth Spurt's.
    The head is three fifths of the height. The face looks a little to the
    right, the way the sprite faces when it walks. Paper is the player's and
    nothing else's on the field (law 10): head, hands and body. The chin is an
    ink line only where the head sits on the body (clipped to it), at the
    outline's weight. The head is paper, so it takes no glint; the eyes have
    theirs.
    CONFORM adds the outline; there is none here, and no strokes.
    Colours are palette hex values: paper #EFE7D6, ink #2A2521, blush #EBA39C.
  -->
  <defs>
    <!-- the body the head sits on: the chin line is drawn only over it -->
    <clipPath id="body">
      <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z"/>
    </clipPath>
  </defs>
  <!-- the legs: short and round-footed -->
  <path d="M38.6 85 L48 85 L48 93.6 C48 96.2 46 98 43.3 98 C40.6 98 38.6 96.2 38.6 93.6 Z M52 85 L61.4 85 L61.4 93.6 C61.4 96.2 59.4 98 56.7 98 C54 98 52 96.2 52 93.6 Z" fill="#EFE7D6"/>
  <!-- the arms, a little out from the body, and the mitten hands -->
  <rect x="-3.9" y="0" width="7.8" height="14" rx="3.9" transform="translate(34.5 63.5) rotate(42)" fill="#EFE7D6"/>
  <rect x="-3.9" y="0" width="7.8" height="14" rx="3.9" transform="translate(65.5 63.5) rotate(-42)" fill="#EFE7D6"/>
  <ellipse cx="24.4" cy="75.2" rx="4.8" ry="5" fill="#EFE7D6"/>
  <ellipse cx="75.6" cy="75.2" rx="4.8" ry="5" fill="#EFE7D6"/>
  <!-- the body: a round-bellied bean -->
  <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z" fill="#EFE7D6"/>
  <!-- the head: the same markup in all seven player drawings -->
  <g id="head">
    <ellipse cx="50" cy="36.9" rx="30" ry="28" fill="#2A2521" clip-path="url(#body)"/>
    <path d="M39.8 10 C39.2 6.4 41 3 44.6 1.4 C46.4 0.6 48.4 0.3 50 0.6 C50.8 0.8 50.9 1.5 50.3 1.9 C48 3.1 46.6 4.6 46 6.2 C45.6 7.4 45.6 8.6 45.9 10 Z" fill="#2A2521"/>
    <ellipse cx="50" cy="35" rx="30" ry="28" fill="#EFE7D6"/>
    <ellipse cx="42.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <ellipse cx="63.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <circle cx="40.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <circle cx="61.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <ellipse cx="36.3" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <ellipse cx="69.7" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <path d="M50.2 48.2 C50.6 47.6 51.4 47.7 51.7 48.3 C52.6 50 55 50 55.9 48.3 C56.2 47.7 57 47.6 57.4 48.2 C57.7 48.6 57.6 49 57.3 49.5 C55.9 52.2 51.7 52.2 50.3 49.5 C50 49 49.9 48.6 50.2 48.2 Z" fill="#2A2521"/>
  </g>
</svg>
