<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Substitute teacher</title>
  <desc>A standing pictogram figure in a cardigan and a lanyard, holding a clipboard up and reading it, not looking at the viewer.</desc>
  <!--
    Substitute teacher (SCHOOL-ROSTER section 3.5). The idle pose: slow, not
    pursuing, stopped to consult the clipboard. Drawn as the role (law 9): the
    clipboard, the lanyard and the cardigan are the character; the figure only
    carries them.

    Silhouette (law 11, School's first reservation): the bright hard
    rectangle. The clipboard is held out to one side so its square corners
    make the right-hand edge of the outline, and it is the brightest thing on
    the sprite. It is bone, never paper (section 6.2: paper is the player's).
    Nothing else here is bone. The badge on the lanyard is small, dark and
    round-cornered, so the act still has exactly one bright hard rectangle.

    No gold anywhere (G-031, section 6.1): the ranged colour rides the
    projectile, never the body.

    The head is a rounded lump in the cardigan's green, the same flat tone as
    the body, the way a pictogram draws a head. No hair, no features beyond
    the face (D-007). Face (law 5): two half-lidded eyes and a flat mouth, set
    low and to the right, cast down at the clipboard and never at the player.

    Contrast against school-deep is carried by school-mid, bone and ink; the
    warm grey-brown trousers are the only low-contrast area. CONFORM adds the
    outline; there is none here, and the gaps between arm, body and head
    close into it. Colours: school-mid #6B7F53, bone #D2C6AC,
    shadow #6E6353, ink #2A2521.
  -->
  <!-- the free arm, hanging -->
  <rect x="21" y="30" width="7.5" height="28" rx="3.75" fill="#6B7F53"/>
  <rect x="20.5" y="56" width="8.5" height="7.5" rx="3.5" fill="#6B7F53"/>
  <!-- trousers and shoes -->
  <path d="M31,64 L48.5,64 L47.5,93 L30,93 Z" fill="#6E6353"/>
  <path d="M51.5,64 L69,64 L70,93 L52.5,93 Z" fill="#6E6353"/>
  <rect x="27" y="92" width="20.5" height="7" rx="2" fill="#2A2521"/>
  <rect x="52.5" y="92" width="20.5" height="7" rx="2" fill="#2A2521"/>
  <!-- cardigan -->
  <path d="M30,36 Q30,27.5 38,27.5 L62,27.5 Q70,27.5 70,36 L69,66 L31,66 Z" fill="#6B7F53"/>
  <!-- lanyard and its badge -->
  <path d="M38,27.5 L42.5,42 L44.5,42 L40.5,27.5 Z" fill="#2A2521"/>
  <path d="M50,27.5 L44.5,42 L42.5,42 L47.5,27.5 Z" fill="#2A2521"/>
  <rect x="39" y="41" width="9" height="9.5" rx="1.5" fill="#2A2521"/>
  <rect x="40.5" y="42.5" width="6" height="6.5" rx="1" fill="#6E6353"/>
  <!-- cardigan buttons -->
  <rect x="42.4" y="54" width="3.2" height="3.2" rx="0.5" fill="#2A2521"/>
  <rect x="42.4" y="59.8" width="3.2" height="3.2" rx="0.5" fill="#2A2521"/>
  <!-- the clipboard: square corners, a clip, three ruled lines and no text -->
  <rect x="51" y="30" width="30" height="39" fill="#D2C6AC"/>
  <rect x="60" y="27" width="12" height="6" rx="1" fill="#2A2521"/>
  <rect x="55" y="39" width="20" height="2" fill="#6E6353"/>
  <rect x="55" y="45" width="22" height="2" fill="#6E6353"/>
  <rect x="55" y="51" width="15.6" height="2" fill="#6E6353"/>
  <!-- the hand holding it up from underneath -->
  <rect x="65" y="63" width="10" height="7.5" rx="3.5" fill="#6B7F53"/>
  <!-- head, bowed toward the clipboard; the face is low and to the right -->
  <g transform="rotate(10 50 13.5)">
    <rect x="38.5" y="2" width="23" height="23" rx="10" fill="#6B7F53"/>
    <path d="M48,13.6 H52.6 Q52.4,16.9 50.3,16.9 Q48.2,16.9 48,13.6 Z" fill="#2A2521"/>
    <path d="M54.4,13.6 H59 Q58.8,16.9 56.7,16.9 Q54.6,16.9 54.4,13.6 Z" fill="#2A2521"/>
    <rect x="51.8" y="19.4" width="4.8" height="1.7" fill="#2A2521"/>
  </g>
</svg>
