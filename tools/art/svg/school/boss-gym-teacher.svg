<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1200" height="1200">
  <!--
    The Gym Teacher (SCHOOL-ROSTER section 9). Enormous, standing, never
    moving, bored. Drawn as the role (law 9): the whistle on its cord, the
    stopwatch held up to the eye, the high-waisted gym shorts, the tube
    socks. The person only carries them: a boss-teal lump with a small head,
    no hair, no skin, no features beyond the face (D-007).

    Face: half-lidded, set to the right of the head and cast at the watch,
    never at the player (law 8's flavour, kept for this boss). A short flat
    mouth. Deadpan.

    Silhouette (law 11, School's sixth reservation): akimbo. The fist on the
    hip closes a loop of floor beside the body; nothing else in the act has a
    hole through it. The stopwatch is an ellipse with a crown, not a circle
    (the circle is the dodgeball's); the waistband is ink and curved and the
    socks taper, so nothing here is a bright hard rectangle (the
    substitute's); the cord is curved, never a hard diagonal (the sash).

    The whistle is bone, not gold. Section 9 asks for gold, but gold is
    ranged, School holds ranged for projectiles (G-031, section 1: "no other
    School enemy may be gold"), and CONFORM quantises a colour the asset does
    not hold. Drawn in bone until the reservation says otherwise.

    The boss carries the full register (D-018): halftone shadow on the right,
    a flat gleam upper left. Teal sits 0.10 L from school-deep, so bone, ink
    and school-mid carry the contrast. CONFORM adds the outline; none here.
    Colours: threat-boss #2F7370, bone #D2C6AC, ink #2A2521,
    school-mid #6B7F53.
  -->
  <defs>
    <clipPath id="torso"><path d="M30,26.5 C23,26.5 20.5,31 20,38 C19.2,45 19.4,51 21,57 L79,57 C80.6,51 80.8,45 80,38 C79.5,31 77,26.5 70,26.5 Z"/></clipPath>
  </defs>
  <g shape-rendering="crispEdges">
