<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>The Gym Teacher</title>
  <desc>A tall standing figure in gym shorts with a whistle on a cord. The role, not a person: the whistle and the shorts are the character.</desc>
  <!-- Bone carries the bulk (teal is too close to School's ground to);
       the reserved boss teal is the shorts and the cord. -->
  <path d="M30 26 L70 26 L78 60 L22 60 Z" fill="#D2C6AC"/>
  <path d="M22 30 L30 26 L24 56 L16 54 Z" fill="#D2C6AC"/>
  <path d="M78 30 L70 26 L76 56 L84 54 Z" fill="#D2C6AC"/>
  <path d="M22 60 L78 60 L76 76 L54 76 L52 70 L48 70 L46 76 L24 76 Z" fill="#2F7370"/>
  <rect x="29" y="76" width="9" height="20" fill="#6B7F53"/>
  <rect x="62" y="76" width="9" height="20" fill="#6B7F53"/>
  <rect x="26" y="94" width="14" height="5" rx="2" fill="#2A2521"/>
  <rect x="60" y="94" width="14" height="5" rx="2" fill="#2A2521"/>
  <circle cx="50" cy="15" r="12" fill="#D2C6AC"/>
  <ellipse cx="45" cy="14" rx="1.8" ry="2.8" fill="#2A2521"/>
  <ellipse cx="55" cy="14" rx="1.8" ry="2.8" fill="#2A2521"/>
  <rect x="46" y="20" width="8" height="1.8" rx="0.8" fill="#2A2521"/>
  <!-- The whistle, on its cord. -->
  <path d="M42 26 L50 44 L58 26" fill="none" stroke="#2F7370" stroke-width="2.4"/>
  <circle cx="50" cy="46" r="4" fill="#2A2521"/>
  <rect x="50" y="44" width="7" height="4" fill="#2A2521"/>
</svg>
