<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1200" height="1200">
  <title>The Gym Teacher</title>
  <desc>A big standing figure in kid proportions, a boss-teal shirt and bone gym shorts, fists on hips, a bone whistle on a cord on its chest, striped tube socks and sneakers, looking off to one side with a small pleased smile.</desc>
  <!--
    The Gym Teacher (SCHOOL-ROSTER section 9), in the greeting-card register
    (ART-DIRECTION section 2026-09-28, G-053). Standing, never moving. Kid
    proportions at boss scale: a big head, a round belly, stubby arms and
    legs, mitten fists.

    Silhouette (law 11, School's sixth reservation): the tallest thing in the
    act, a standing figure in gym shorts with a whistle on a cord. The
    whistle is the only thing it carries (the reservation's consequence), so
    the hands are empty, both fists on the hips; the elbows out leave a hole
    each side, which nothing else in the act has. Law 9: the whistle and the
    shorts are the role, not a person. The cord is a curve, never a hard
    diagonal (the sash's); the whistle is a barrel and a mouthpiece, never a
    circle (the dodgeball's); nothing here is a bright hard rectangle (the
    substitute's).

    Colour (law 6): the shirt is boss teal, as Conception's Egg holds it and
    nothing else in School wears it. The whistle is bone, not gold: School's
    gold belongs to the substitute's shot alone (G-031). Teal sits 0.10 L
    from school-deep, so the green head and arms, the bone shorts and socks
    and the ink carry the contrast; the shorts are round, never a bright
    hard rectangle. The head is the act's mid green, the way School
    draws a person: no hair (the cowlick is the player's), no features
    beyond the face (D-007). The face looks off to one side, never at the
    player: two big ink eyes with one bone glint each, blush, a small
    pleased mouth. One bone glint on the head and one on the shirt, upper
    left, never paper (law 10). No halftone and no gradients; CONFORM adds
    the outline and TEXTURE the boss grain. No strokes. Colours:
    threat-boss #2F7370, school-mid #6B7F53, bone #D2C6AC, ink #2A2521,
    blush #EBA39C.
  -->
  <!-- sneakers, toes turned out, bone soles -->
  <path d="M26,98 Q25,92.5 31,91.5 L42,91 Q44.5,91.5 44.5,94.5 L44.5,98 Z" fill="#2A2521"/>
  <path d="M74,98 Q75,92.5 69,91.5 L58,91 Q55.5,91.5 55.5,94.5 L55.5,98 Z" fill="#2A2521"/>
  <rect x="25.4" y="96.6" width="19.4" height="2.4" rx="1.2" fill="#D2C6AC"/>
  <rect x="55.2" y="96.6" width="19.4" height="2.4" rx="1.2" fill="#D2C6AC"/>
  <!-- stubby legs in tube socks, two teal stripes each -->
  <path d="M32.6,79 L44.4,79 L43.4,92 Q43.2,93.5 41.6,93.5 L35.4,93.5 Q33.8,93.5 33.6,92 Z" fill="#D2C6AC"/>
  <path d="M55.6,79 L67.4,79 L66.4,92 Q66.2,93.5 64.6,93.5 L58.4,93.5 Q56.8,93.5 56.6,92 Z" fill="#D2C6AC"/>
  <path d="M33,85 H44 L43.85,86.9 H33.15 Z" fill="#2F7370"/>
  <path d="M33.3,88.4 H43.7 L43.55,90.3 H33.45 Z" fill="#2F7370"/>
  <path d="M56,85 H67 L66.85,86.9 H56.15 Z" fill="#2F7370"/>
  <path d="M56.3,88.4 H66.7 L66.55,90.3 H56.45 Z" fill="#2F7370"/>
  <!-- the arms, akimbo: teal sleeve, green forearm, the fist on the hip -->
  <rect x="11" y="44" width="20" height="9.5" rx="4.75" transform="rotate(145 21 48.75)" fill="#2F7370"/>
  <rect x="10" y="57" width="18" height="8.5" rx="4.25" transform="rotate(38 19 61.25)" fill="#6B7F53"/>
  <rect x="69" y="44" width="20" height="9.5" rx="4.75" transform="rotate(-145 79 48.75)" fill="#2F7370"/>
  <rect x="72" y="57" width="18" height="8.5" rx="4.25" transform="rotate(-38 81 61.25)" fill="#6B7F53"/>
  <!-- the gym shorts, soft and round, a teal stripe down each side -->
  <path d="M26,65 L74,65 Q79.5,72 77.5,79.5 Q76.5,84.5 70,84 L57,83.4 Q52.6,83 51.8,79.4 Q50,75.8 48.2,79.4 Q47.4,83 43,83.4 L30,84 Q23.5,84.5 22.5,79.5 Q20.5,72 26,65 Z" fill="#D2C6AC"/>
  <path d="M25.3,69 Q23.3,75 24.6,82.6 L27.4,83.6 Q26.3,75.6 28.1,69 Z" fill="#2F7370"/>
  <path d="M74.7,69 Q76.7,75 75.4,82.6 L72.6,83.6 Q73.7,75.6 71.9,69 Z" fill="#2F7370"/>
  <!-- the shirt: a round belly -->
  <path d="M38,41 L62,41 Q72,42 74.5,50 Q77.5,60 72.5,67 L27.5,67 Q22.5,60 25.5,50 Q28,42 38,41 Z" fill="#2F7370"/>
  <!-- the shirt's one glint -->
  <ellipse cx="33.5" cy="47.5" rx="2.2" ry="1.5" transform="rotate(-45 33.5 47.5)" fill="#D2C6AC"/>
  <!-- fists on the hips -->
  <ellipse cx="25" cy="66" rx="5.2" ry="5" fill="#6B7F53"/>
  <ellipse cx="75" cy="66" rx="5.2" ry="5" fill="#6B7F53"/>
  <!-- the cord, a soft loop from the neck, and the whistle on it -->
  <path d="M40,41 Q40.5,51 48,54.5 L48.6,52.9 Q42.4,50 42.2,41 Z" fill="#2A2521"/>
  <path d="M60,41 Q59.5,51 52.5,54.3 L51.8,52.7 Q57.6,50 57.8,41 Z" fill="#2A2521"/>
  <rect x="39.5" y="52.6" width="11" height="5" rx="1.8" fill="#D2C6AC"/>
  <ellipse cx="52" cy="57.4" rx="6.4" ry="5.6" fill="#D2C6AC"/>
  <rect x="45" y="52.6" width="3.6" height="1.8" rx="0.6" fill="#2A2521"/>
  <!-- head: a big rounded lump, wider than tall (the circle is the dodgeball's) -->
  <ellipse cx="50" cy="21" rx="21" ry="19" fill="#6B7F53"/>
  <!-- the head's one glint -->
  <ellipse cx="36.5" cy="9.5" rx="2.1" ry="1.4" transform="rotate(-40 36.5 9.5)" fill="#D2C6AC"/>
  <!-- face, looking off to one side -->
  <ellipse cx="49.5" cy="21.5" rx="4.5" ry="5.4" fill="#2A2521"/>
  <ellipse cx="61.5" cy="21.5" rx="4.5" ry="5.4" fill="#2A2521"/>
  <circle cx="47.9" cy="19.3" r="1.7" fill="#D2C6AC"/>
  <circle cx="59.9" cy="19.3" r="1.7" fill="#D2C6AC"/>
  <ellipse cx="42.5" cy="30" rx="3.5" ry="2.2" fill="#EBA39C"/>
  <ellipse cx="64.6" cy="30" rx="3.3" ry="2.2" fill="#EBA39C"/>
  <path d="M52.4,29.4 Q55.5,34.4 58.6,29.4 Q55.5,31.6 52.4,29.4 Z" fill="#2A2521"/>
</svg>
