r="0.8"/><circle cx="76.4" cy="50.38" r="0.8"/><circle cx="78.8" cy="50.38" r="0.8"/><circle cx="20" cy="52.46" r="0.8"/><circle cx="24.8" cy="52.46" r="0.8"/><circle cx="63.2" cy="52.46" r="0.8"/><circle cx="68" cy="52.46" r="0.8"/><circle cx="70.4" cy="52.46" r="0.8"/><circle cx="72.8" cy="52.46" r="0.8"/><circle cx="75.2" cy="52.46" r="0.8"/><circle cx="77.6" cy="52.46" r="0.8"/><circle cx="80" cy="52.46" r="0.8"/><circle cx="21.2" cy="54.54" r="0.8"/><circle cx="23.6" cy="54.54" r="0.8"/><circle cx="28.4" cy="54.54" r="0.8"/><circle cx="62" cy="54.54" r="0.8"/><circle cx="64.4" cy="54.54" r="0.8"/><circle cx="66.8" cy="54.54" r="0.8"/><circle cx="69.2" cy="54.54" r="0.8"/><circle cx="71.6" cy="54.54" r="0.8"/><circle cx="74" cy="54.54" r="0.8"/><circle cx="76.4" cy="54.54" r="0.8"/><circle cx="78.8" cy="54.54" r="0.8"/><circle cx="20" cy="56.62" r="0.8"/><circle cx="22.4" cy="56.62" r="0.8"/><circle cx="24.8" cy="56.62" r="0.8"/><circle cx="27.2" cy="56.62" r="0.8"/><circle cx="29.6" cy="56.62" r="0.8"/><circle cx="34.4" cy="56.62" r="0.8"/><circle cx="53.6" cy="56.62" r="0.8"/><circle cx="58.4" cy="56.62" r="0.8"/><circle cx="60.8" cy="56.62" r="0.8"/><circle cx="63.2" cy="56.62" r="0.8"/><circle cx="65.6" cy="56.62" r="0.8"/><circle cx="68" cy="56.62" r="0.8"/><circle cx="70.4" cy="56.62" r="0.8"/><circle cx="72.8" cy="56.62" r="0.8"/><circle cx="75.2" cy="56.62" r="0.8"/><circle cx="77.6" cy="56.62" r="0.8"/><circle cx="80" cy="56.62" r="0.8"/></g>
  <!-- gleam -->
  <path d="M23.6,46 C22.8,39.6 25.4,33.8 30.8,30.6 C28.2,34.8 26.4,40 26.2,46 Z" fill="#D2C6AC"/>
