<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player at thirty-four</title>
  <desc>The same chubby child as at twenty-two, no taller, the same face, blush and one cowlick, in the same shirt, collar and belt with the tie gone, a round tote bag hanging from one shoulder and a ring of keys dangling from the other hand, held up.</desc>
  <!--
    The player at thirty-four (G-003, G-053; FAMILY-ROSTER §5). The same
    drawing as player-office with the props changed: the head group is
    player-school's markup verbatim, the legs, the shirt, the collar, the belt
    and both arms are the twenty-two-year-old's geometry, and the figure spans
    the same height, so the head is drawn at the same size and height. Not
    taller: taller is Growth Spurt's. The face does not change.
    What went: the tie and its knot, and the mug; with the knot gone the
    collar's two round leaves meet under the chin on their own. What came:
    over the right shoulder, the tote's handles as one flat strap in shadow
    down to a round-cornered bag, a little wider at its foot, an ink hem under
    its mouth and one paper glint, upper left, hanging at the hip behind the
    arm. In the left hand, raised where the mug was, a ring of keys: an ink
    ring through the fist and two keys dangling from it, each a round bow with
    an ink hole and a short blade with round teeth, in bone, so they read
    against the carpet. Head, shirt, collar, legs and hands stay paper, which
    is the player's and nothing else's (law 10); the bag takes the shadow and
    the keys the bone. Nothing is written on anything; the bag carries no
    stripe (the tape is the flat-pack's) and nothing on the player is folded,
    coiled or gabled (law 11).
    CONFORM adds the outline; there is none here, and no strokes.
    Colours are palette hex values: paper #EFE7D6, bone #D2C6AC,
    shadow #6E6353, ink #2A2521, blush #EBA39C.
  -->
  <defs>
    <!-- the body the head sits on: the chin line is drawn only over it -->
    <clipPath id="body">
      <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z"/>
    </clipPath>
  </defs>
  <!-- the legs, as at school -->
  <path d="M38.6 85 L48 85 L48 93.6 C48 96.2 46 98 43.3 98 C40.6 98 38.6 96.2 38.6 93.6 Z M52 85 L61.4 85 L61.4 93.6 C61.4 96.2 59.4 98 56.7 98 C54 98 52 96.2 52 93.6 Z" fill="#EFE7D6"/>
  <!-- the left arm, raised as at twenty-two -->
  <g fill="#EFE7D6">
    <rect x="-4" y="-4" width="8" height="18.74" rx="4" transform="translate(35.5 64) rotate(27.8)"/>
    <rect x="-3.8" y="-3.8" width="7.6" height="16.68" rx="3.8" transform="translate(30.5 73.5) rotate(118.3)"/>
  </g>
  <!-- the shirt, as at twenty-two -->
  <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z" fill="#EFE7D6"/>
  <!-- the belt, as at twenty-two -->
  <rect x="30" y="83.4" width="40" height="2" fill="#2A2521" clip-path="url(#body)"/>
  <!-- the collar: the same two round leaves, meeting where the knot was -->
  <g fill="#2A2521">
    <ellipse cx="0" cy="0" rx="4.6" ry="6.4" transform="translate(45 63.2) rotate(48)"/>
    <ellipse cx="0" cy="0" rx="4.6" ry="6.4" transform="translate(55 63.2) rotate(-48)"/>
  </g>
  <g fill="#EFE7D6">
    <ellipse cx="0" cy="0" rx="3.2" ry="5" transform="translate(45 63.2) rotate(48)"/>
    <ellipse cx="0" cy="0" rx="3.2" ry="5" transform="translate(55 63.2) rotate(-48)"/>
  </g>
  <!-- the tote's handles: one flat strap from behind the head, over the
       right shoulder, down to the bag -->
  <path d="M61.6 57 L66 57.6 L65.4 73 L61 73 Z" fill="#6E6353"/>
  <!-- the tote: round-cornered, a little wider at its foot -->
  <path d="M61.6 71.4 L73.8 71.4 C75 71.4 75.8 72.1 75.9 73.3 L77.1 86.2 C77.3 88 76.2 89.2 74.4 89.2 L61 89.2 C59.2 89.2 58.1 88 58.3 86.2 L59.5 73.3 C59.6 72.1 60.4 71.4 61.6 71.4 Z" fill="#6E6353"/>
  <!-- an ink hem under its mouth -->
  <path d="M59.4 74.2 L76 74.2 L76.1 75.6 L59.3 75.6 Z" fill="#2A2521"/>
  <!-- one glint on the tote, upper left -->
  <circle cx="61.9" cy="77.6" r="0.75" fill="#EFE7D6"/>
  <!-- the right arm, down at the side as at school, over the bag -->
  <rect x="-3.9" y="0" width="7.8" height="14" rx="3.9" transform="translate(65.5 63.5) rotate(-42)" fill="#EFE7D6"/>
  <ellipse cx="75.6" cy="75.2" rx="4.8" ry="5" fill="#EFE7D6"/>
  <!-- the head: the same markup in all seven player drawings -->
  <g id="head">
    <ellipse cx="50" cy="36.9" rx="30" ry="28" fill="#2A2521" clip-path="url(#body)"/>
    <path d="M39.8 10 C39.2 6.4 41 3 44.6 1.4 C46.4 0.6 48.4 0.3 50 0.6 C50.8 0.8 50.9 1.5 50.3 1.9 C48 3.1 46.6 4.6 46 6.2 C45.6 7.4 45.6 8.6 45.9 10 Z" fill="#2A2521"/>
    <ellipse cx="50" cy="35" rx="30" ry="28" fill="#EFE7D6"/>
    <ellipse cx="42.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <ellipse cx="63.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <circle cx="40.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <circle cx="61.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <ellipse cx="36.3" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <ellipse cx="69.7" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <path d="M50.2 48.2 C50.6 47.6 51.4 47.7 51.7 48.3 C52.6 50 55 50 55.9 48.3 C56.2 47.7 57 47.6 57.4 48.2 C57.7 48.6 57.6 49 57.3 49.5 C55.9 52.2 51.7 52.2 50.3 49.5 C50 49 49.9 48.6 50.2 48.2 Z" fill="#2A2521"/>
  </g>
  <!-- the keys: two dangling from the ring, bone, each a round bow with an
       ink hole and a short blade with round teeth -->
  <g fill="#D2C6AC">
    <g transform="translate(21.8 76.6) rotate(6)">
      <circle cx="0" cy="3.1" r="3.1"/>
      <path d="M-1.25 5.4 L1.25 5.4 L1.25 13 C1.25 13.9 0.7 14.4 0 14.4 C-0.7 14.4 -1.25 13.9 -1.25 13 Z"/>
      <circle cx="1.9" cy="9.2" r="1.2"/>
      <circle cx="1.9" cy="12.2" r="1.1"/>
    </g>
    <g transform="translate(19.9 76.2) rotate(44)">
      <circle cx="0" cy="2.9" r="2.9"/>
      <path d="M-1.15 5 L1.15 5 L1.15 11.4 C1.15 12.2 0.6 12.7 0 12.7 C-0.6 12.7 -1.15 12.2 -1.15 11.4 Z"/>
      <circle cx="1.8" cy="8.8" r="1.1"/>
    </g>
  </g>
  <g fill="#2A2521">
    <circle cx="0" cy="3.1" r="1.15" transform="translate(21.8 76.6) rotate(6)"/>
    <circle cx="0" cy="2.9" r="1.05" transform="translate(19.9 76.2) rotate(44)"/>
  </g>
  <!-- the ring, ink, through the fist -->
  <path fill-rule="evenodd" d="M24.6 74.6 A3.3 3.3 0 1 0 18 74.6 A3.3 3.3 0 1 0 24.6 74.6 Z M23.2 74.6 A1.9 1.9 0 1 1 19.4 74.6 A1.9 1.9 0 1 1 23.2 74.6 Z" fill="#2A2521"/>
  <!-- the left hand, raised where the mug was, round the ring -->
  <ellipse cx="22.5" cy="69.2" rx="4.4" ry="4.6" fill="#EFE7D6"/>
</svg>
