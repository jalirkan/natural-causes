<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>The Mortgage, door open</title>
  <desc>The Mortgage exactly as it stands, a teal house front under one plain gable with a small chimney on the right slope, on a low plinth, its two bone windows its eyes, level and looking straight out, with one change: the door is open. The doorway in the middle of the ground floor, its mouth, is a dark opening inside the same ink frame, the carpet seen through it, and the door itself has swung inward and shows only as a thin grey-brown edge against the left jamb. The letterbox went in with it. Nobody is in the doorway. It has been paid.</desc>
  <!--
    The Mortgage, door open (FAMILY-ROSTER section 4, the ending: on the
    twelfth payment the door opens). A variant frame (D-029) of its holder,
    boss-mortgage: the same drawing in another state. It holds the house's
    reservation and reserves nothing; the renderer swaps boss-mortgage for
    this frame on the twelfth payment, where the door overlay stood (AUDIT
    83: the overlay covered the ink frame, so the door read as a hole cut in
    the wall). Law 9 and D-007: nobody is drawn and nobody is home; nothing
    stands in the doorway.

    Everything but the door is boss-mortgage.svg byte for byte: the chimney,
    the plinth, the walls and their halftone, the seam, the roof, the eave
    and soffit, the gleam and both windows. See that file for the
    silhouette, the face and the register; they do not change.

    The one change, inside the door rectangle (x 160-223, y 266-351 of the
    384 sprite, frame included): the ink frame is kept path for path, so it
    reads as a framed doorway. The panel inside it, shadow on the shut door,
    is the act's deep umber (#4D3A1F), the carpet seen through the doorway;
    it is the background colour, which is the point, and the check counts it
    as vanishing, which it can afford at this size. The door has swung
    inward and is seen edge-on as a thin shadow (#6E6353) sliver, 2.5 wide
    at the head narrowing to 2.4 at the floor (hand-cut, law 4), against the
    left jamb: hinged left, as the room's plan draws its door (the leaf up
    from the left jamb, room.svg), because the room is what this house
    leaves behind and it is the same door. The letterbox was on the leaf, so
    it went in with it: the mouth is open, not a line.

    Body (`bossBody`): unchanged, { cy: 0.68, r: 0.30 }; the silhouette is
    the holder's.

    Colours: threat-boss #2F7370, ink #2A2521, bone #D2C6AC, shadow #6E6353,
    and family-deep #4D3A1F for the doorway alone.
  -->
  <defs>
    <clipPath id="wall"><path d="M15.4,42 L84.7,42 Q85.2,67 85.4,92 L14.7,92 Q14.9,67 15.4,42 Z"/></clipPath>
  </defs>
  <!-- the chimney, behind the roof: a plain stack, no smoke -->
  <path d="M66.6,27 L66.9,12.6 L75.3,12.4 L75.6,27 Z" fill="#2F7370"/>
  <path d="M65.2,13.6 L65.3,9.4 Q70.9,9 76.9,9.3 L77,13.6 Z" fill="#2F7370"/>
  <path d="M66.9,13.4 L75.3,13.3 L75.3,15.3 L66.9,15.4 Z" fill="#2A2521"/>
  <!-- the plinth the house stands on -->
