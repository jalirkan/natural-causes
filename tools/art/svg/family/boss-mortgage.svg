  <!-- the seam where the walls sit on the plinth -->
  <path d="M14.7,90.9 L85.4,90.9 L85.5,92.9 L14.6,92.9 Z" fill="#2A2521"/>
  <!-- the roof: one gable, the only roof in the act -->
  <path d="M4,43 L48.9,5.4 Q50,4.4 51.1,5.45 L96,43.2 Q50,43.6 4,43 Z" fill="#2F7370"/>
  <!-- the eave: one ink line over the wall, level with the outline under the overhangs, and the roof's underside -->
