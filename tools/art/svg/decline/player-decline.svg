<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player at fifty-five</title>
  <desc>The same chubby child as at thirty-four, no taller, the same face, blush and one cowlick, in an oatmeal cardigan buttoned down the front over the same shirt collar, one arm down at its side and the other hand on a plain crook-handled cane with its tip on the floor.</desc>
  <!--
    The player at fifty-five (G-003, G-053; DECLINE-ROSTER §5: "the same
    figure, a cardigan and a cane"). The same drawing as player-family with
    the props changed: the head group is player-school's markup verbatim, the
    legs, the body's outline, the collar's two round leaves and the free arm
    are the earlier drawings' geometry, and the figure spans the same height,
    so the head is drawn at the same size and height. Not taller: taller is
    Growth Spurt's. The face does not change: the kid is the kid at the end
    too.
    What went: the tote and its strap, the keys and their ring, the belt,
    which the cardigan now covers, and the raised hand.
    What came: the body is a cardigan in bone, with one paper glint, upper
    left; a V of the paper shirt from the shoulders to a point under the
    collar, its button bands in shadow; three round shadow buttons below the
    point (three, not two: the knees are the act's only pair; round, not
    square: the boxes are the form's); a ribbed hem band in shadow along the
    body's foot; bone sleeves on both arms. In the left hand, down at the
    side, a plain cane in shadow: the shaft from the fist to its tip on the
    floor, level with the feet, and a crook over the fist turned away from the
    body, thick enough that CONFORM's outline edges it rather than swallowing
    it (its hollow fills with the outline's ink; the hook still reads). Head, shirt, collar and hands stay
    paper, which is the player's and nothing else's (law 10). No glasses.
    Nothing is written on anything. The crook is not the clock's hand and the
    shaft is not the stairs' rail: one cane, held, planted.
    CONFORM adds the outline; there is none here, and no strokes.
    Colours are palette hex values: paper #EFE7D6, bone #D2C6AC,
    shadow #6E6353, ink #2A2521, blush #EBA39C.
  -->
  <defs>
    <!-- the body the head sits on: the chin line is drawn only over it -->
    <clipPath id="body">
      <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z"/>
    </clipPath>
  </defs>
  <!-- the legs, as at school -->
  <path d="M38.6 85 L48 85 L48 93.6 C48 96.2 46 98 43.3 98 C40.6 98 38.6 96.2 38.6 93.6 Z M52 85 L61.4 85 L61.4 93.6 C61.4 96.2 59.4 98 56.7 98 C54 98 52 96.2 52 93.6 Z" fill="#EFE7D6"/>
  <!-- the arms, down at the sides as at school, in the cardigan's sleeves -->
  <rect x="-3.9" y="0" width="7.8" height="14" rx="3.9" transform="translate(34.5 63.5) rotate(42)" fill="#D2C6AC"/>
  <rect x="-3.9" y="0" width="7.8" height="14" rx="3.9" transform="translate(65.5 63.5) rotate(-42)" fill="#D2C6AC"/>
  <ellipse cx="75.6" cy="75.2" rx="4.8" ry="5" fill="#EFE7D6"/>
  <!-- the cardigan: the body's outline, bone -->
  <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z" fill="#D2C6AC"/>
  <!-- its button bands: a wide V from the shoulders to a point under the collar -->
  <path d="M33.4 56 L39.6 56 L50 68.2 L60.4 56 L66.6 56 L51.4 73.6 C50.7 74.4 49.3 74.4 48.6 73.6 Z" fill="#6E6353" clip-path="url(#body)"/>
  <!-- the shirt inside the V, paper -->
  <path d="M37 56 L63 56 L50 70.8 Z" fill="#EFE7D6" clip-path="url(#body)"/>
  <!-- three round buttons down the front, below the point -->
  <circle cx="50" cy="76.6" r="1.35" fill="#6E6353"/>
  <circle cx="50" cy="80" r="1.35" fill="#6E6353"/>
  <circle cx="50" cy="83.4" r="1.35" fill="#6E6353"/>
  <!-- the ribbed hem, along the body's foot -->
  <rect x="30" y="86.4" width="40" height="3" fill="#6E6353" clip-path="url(#body)"/>
  <!-- one glint on the cardigan, upper left -->
  <ellipse cx="36.4" cy="66.2" rx="1.2" ry="1.4" fill="#EFE7D6"/>
  <!-- the collar, as at thirty-four: the same two round leaves, over the V -->
  <g fill="#2A2521">
    <ellipse cx="0" cy="0" rx="4.6" ry="6.4" transform="translate(45 63.2) rotate(48)"/>
    <ellipse cx="0" cy="0" rx="4.6" ry="6.4" transform="translate(55 63.2) rotate(-48)"/>
  </g>
  <g fill="#EFE7D6">
    <ellipse cx="0" cy="0" rx="3.2" ry="5" transform="translate(45 63.2) rotate(48)"/>
    <ellipse cx="0" cy="0" rx="3.2" ry="5" transform="translate(55 63.2) rotate(-48)"/>
  </g>
  <!-- the head: the same markup in all seven player drawings -->
  <g id="head">
    <ellipse cx="50" cy="36.9" rx="30" ry="28" fill="#2A2521" clip-path="url(#body)"/>
    <path d="M39.8 10 C39.2 6.4 41 3 44.6 1.4 C46.4 0.6 48.4 0.3 50 0.6 C50.8 0.8 50.9 1.5 50.3 1.9 C48 3.1 46.6 4.6 46 6.2 C45.6 7.4 45.6 8.6 45.9 10 Z" fill="#2A2521"/>
    <ellipse cx="50" cy="35" rx="30" ry="28" fill="#EFE7D6"/>
    <ellipse cx="42.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <ellipse cx="63.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <circle cx="40.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <circle cx="61.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <ellipse cx="36.3" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <ellipse cx="69.7" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <path d="M50.2 48.2 C50.6 47.6 51.4 47.7 51.7 48.3 C52.6 50 55 50 55.9 48.3 C56.2 47.7 57 47.6 57.4 48.2 C57.7 48.6 57.6 49 57.3 49.5 C55.9 52.2 51.7 52.2 50.3 49.5 C50 49 49.9 48.6 50.2 48.2 Z" fill="#2A2521"/>
  </g>
  <!-- the cane, shadow: the shaft from the fist to the floor, level with the
       feet, and a crook over the fist turned away from the body -->
  <rect x="-1.4" y="-0.5" width="2.8" height="27.8" rx="1.4" transform="translate(24.1 70.5) rotate(3.3)" fill="#6E6353"/>
  <path d="M25.5 70.5 A5 5 0 0 0 15.5 70.5 L15.5 71.8 A1.4 1.4 0 0 0 18.3 71.8 L18.3 70.5 A2.2 2.2 0 0 1 22.7 70.5 Z" fill="#6E6353"/>
  <!-- the left hand on the cane, under the crook -->
  <ellipse cx="24.4" cy="75.2" rx="4.8" ry="5" fill="#EFE7D6"/>
</svg>
