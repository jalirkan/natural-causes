<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Driver's ed</title>
  <desc>A lumpy little hatchback seen side-on, on two round wheels, with a blank plate standing on its roof. The front window is its face: two dots and a flat line, looking forward along the road rather than out of the screen. Nobody is inside.</desc>
  <!--
    Driver's ed (ADOLESCENCE-ROSTER §3.2). Side-on, because the rectangle is
    the standardised test's and the dome is acne's: a lumpy hatchback with a
    steep hatch, a bulged roof, a raked windscreen and a stepped bonnet, so
    it is neither slab nor half-circle. The wheels are the read and the
    act's reservation. The blank plate on the roof is the instructor, who is
    never drawn (law 9); it tapers so it is a sign, not a sheet. The front
    window is the face, turned along the road, the one face in the act not
    looking at the player (§2). Nobody inside, nothing with skin (D-007).
    Colours are palette hex values: threat-contact #C4472E (held by this
    asset alone), bone #D2C6AC, shadow #6E6353, ink #2A2521.
    CONFORM adds the outline; there is none here.
  -->
  <!-- the plate on the roof -->
  <path d="M 27 24 L 30 11 Q 30.5 9 32.5 9 L 49.5 9 Q 51.5 9 52 11 L 55 24 Z" fill="#D2C6AC"/>
  <!-- wheels -->
  <circle cx="24" cy="76" r="12" fill="#2A2521"/>
  <circle cx="76" cy="76" r="12" fill="#2A2521"/>
  <circle cx="24" cy="76" r="4.5" fill="#6E6353"/>
  <circle cx="76" cy="76" r="4.5" fill="#6E6353"/>
  <!-- body: hatch, bulged roof, windscreen, bonnet, nose, two arches -->
  <path d="M 7 74 L 5 56 Q 5 50 10 48 L 14 27 Q 15 22 20 22 Q 36 18 52 22 Q 58 22 61 26 L 72 45 Q 74 48 78 48 Q 84 46 89 49 Q 97 50 97 59 L 97 68 Q 97 74 92 74 L 89.5 74 A 13.5 13.5 0 0 0 62.5 74 L 37.5 74 A 13.5 13.5 0 0 0 10.5 74 Z" fill="#C4472E"/>
  <!-- rear window -->
  <path d="M 21 27 L 28 27 Q 29.5 27 29.5 28.5 L 29.5 44.5 Q 29.5 46 28 46 L 17.5 46 Q 16 46 16.3 44.5 L 19.2 28.5 Q 19.5 27 21 27 Z" fill="#D2C6AC"/>
  <!-- front window: the face -->
  <path d="M 36 27 L 55 27 Q 58 27 59.7 29.6 L 68 43.4 Q 69.5 46 66.5 46 L 36 46 Q 34 46 34 44 L 34 29 Q 34 27 36 27 Z" fill="#D2C6AC"/>
  <!-- face, eyes on the road -->
  <circle cx="47" cy="35" r="3.4" fill="#2A2521"/>
  <circle cx="57.5" cy="35" r="3.4" fill="#2A2521"/>
  <rect x="46" y="40.5" width="15" height="3.2" fill="#2A2521"/>
</svg>
