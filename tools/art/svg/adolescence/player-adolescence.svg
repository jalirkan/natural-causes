<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player at thirteen</title>
  <desc>The same face and single cowlick as in every act: the same small round-headed figure as at school age, no taller, in a plain hoodie with the hood down and both hands in its front pocket.</desc>
  <!--
    The player at thirteen (G-003, ADOLESCENCE-ROSTER §6). The same drawing as
    player-school with the costume changed: the head, eyes, mouth and cowlick
    are that file's geometry unchanged, and the figure spans the same height,
    so the head lands on the same pixels. Not taller: taller is Growth Spurt's.
    The face does not change. Everything in this act looks at the player; the
    player keeps the expression it has had since before birth.
    The costume: a hoodie in shadow, the hood rolled down behind the neck, both
    hands in the front pocket, so only the inside edge of each arm shows,
    running into it. The head and the drawstrings stay paper, which is the
    player's and nothing else's (law 10).
    CONFORM adds the outline; there is none here.
    Colours are palette hex values: paper #EFE7D6, shadow #6E6353, ink #2A2521.
  -->
  <!-- The cowlick: one hair, always. -->
  <path d="M54 12 C52 4 58 0 62 3 C58 4 57 8 58 12 Z" fill="#2A2521"/>
  <!-- legs, as at five -->
  <path d="M40 84 L47 84 L47 98 L40 98 Z M53 84 L60 84 L60 98 L53 98 Z" fill="#EFE7D6"/>
  <!-- the hoodie: elbows out where the hands go into the pocket, gathered
       at the hem band -->
  <path d="M31 65 C31 60 36 58 42 58 L58 58 C64 58 69 60 69 65 C71 70 72.5 74 72 78 C71.5 81 69 82 67 82 L67.5 86 C67.5 87.5 66.5 88 65 88 L35 88 C33.5 88 32.5 87.5 32.5 86 L33 82 C31 82 28.5 81 28 78 C27.5 74 29 70 31 65 Z" fill="#6E6353"/>
  <!-- the hem band's seam -->
  <path d="M33.5 81.2 L66.5 81.2 L66.5 83.2 L33.5 83.2 Z" fill="#2A2521"/>
  <!-- the arms, inside edge, running into the pocket -->
  <path d="M34.5 64 C35.5 69 36.5 73 39.5 77 L37.8 78 C34.5 74 33.2 69 32.6 64.4 Z" fill="#2A2521"/>
  <path d="M65.5 64 C64.5 69 63.5 73 60.5 77 L62.2 78 C65.5 74 66.8 69 67.4 64.4 Z" fill="#2A2521"/>
  <!-- the front pocket: its top edge and the two slanted openings -->
  <path d="M38 81.2 L41 71 L59 71 L62 81.2 L59.6 81.2 L57.2 73.4 L42.8 73.4 L40.4 81.2 Z" fill="#2A2521"/>
  <!-- the hood, rolled down behind the neck: an ink seam, then the hood -->
  <ellipse cx="50" cy="60.5" rx="20.5" ry="8" fill="#2A2521"/>
  <ellipse cx="50" cy="59.5" rx="19" ry="6.8" fill="#6E6353"/>
  <!-- the drawstrings -->
  <path d="M45 65 L47 65 L46.6 72 L44.8 72 Z M53 65 L55 65 L55.2 72 L53.4 72 Z" fill="#EFE7D6"/>
  <!-- the head: player-school's, unchanged -->
  <circle cx="50" cy="36" r="26" fill="#EFE7D6"/>
  <ellipse cx="57" cy="34" rx="3.4" ry="6" fill="#2A2521"/>
  <ellipse cx="68" cy="34" rx="3.4" ry="6" fill="#2A2521"/>
  <rect x="58" y="46" width="9" height="2.8" rx="1.3" fill="#2A2521"/>
</svg>
