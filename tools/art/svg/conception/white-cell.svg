<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    White cell (CONCEPTION-ROSTER §3.1), the act's elite. Reserved silhouette:
    the blot. One heavy squat mass, lobes uneven in size and depth so it never
    resolves into a flower: a broad pseudopod on the left, a big dome top
    right, a small nub between, a flat sagging underside.
    CONFORM adds the outline; there is none here.

    Two tones, because they have to be. Elite purple sits 0.113 Oklab L from
    conception-deep, under CHECK's 0.12 floor, so a sprite more than 40%
    purple vanishes into the field. The mass is drawn in conception-mid, and
    the purple body is that same mass eroded by 6.5 units and shifted
    (1.5, 3) down-right, traced to one path. The rose shows as an uneven
    membrane: thick on the lit upper left, thin at the heavy bottom. Filled
    and uneven, so it is not the spermicide's ring.

    The face is the stamp: a flat bone disc set off-centre, two ink dots and
    one flat line. The eyes sit up and to the right. It is looking at where
    something like the player would be, not at the player.

    Colours are palette hex values: conception-mid #A86A63,
    threat-elite #7C5C8A, bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges">
    <!-- the mass: lobes, pseudopod, and fillers that close the gaps between them -->
    <g fill="#A86A63">
      <ellipse cx="50" cy="75" rx="35" ry="14"/>
      <circle cx="36" cy="81" r="10"/>
      <circle cx="70" cy="80" r="11"/>
      <ellipse cx="52" cy="58" rx="26" ry="19"/>
      <circle cx="85" cy="62" r="12"/>
      <circle cx="67" cy="33" r="17"/>
      <circle cx="29" cy="37" r="14"/>
      <ellipse cx="16" cy="61" rx="14" ry="12"/>
      <circle cx="87" cy="45" r="7"/>
      <circle cx="47" cy="40" r="8"/>
      <circle cx="26" cy="50" r="5"/>
      <circle cx="79" cy="48" r="6"/>
      <circle cx="48" cy="27" r="6"/>
    </g>
    <!-- the body: the mass eroded 6.5 and shifted (1.5, 3) -->
    <path fill="#7C5C8A" d="M67.3,25.6 L70.3,25.6 L71.8,26.0 L73.7,26.8 L76.0,28.5 L77.7,30.9 L78.6,33.0 L79.0,34.9 L79.0,37.1 L78.6,39.0 L78.0,40.5 L77.8,42.4 L78.0,44.0 L79.1,46.3 L81.0,48.0 L83.3,48.8 L86.0,48.7 L88.3,47.5 L88.9,47.6 L88.9,48.4 L88.0,48.9 L86.6,50.3 L85.8,51.6 L85.4,53.0 L85.4,55.4 L85.8,56.8 L86.6,58.1 L88.0,59.5 L90.3,61.0 L91.6,62.9 L92.0,64.3 L92.0,65.8 L91.3,67.8 L90.5,68.8 L89.3,69.8 L87.8,70.4 L85.3,70.6 L84.0,71.0 L82.5,71.8 L81.2,73.2 L80.1,75.5 L79.9,78.0 L76.8,81.3 L76.0,83.3 L75.8,84.5 L75.1,85.8 L74.3,86.6 L72.7,87.4 L70.3,87.4 L69.3,87.0 L66.5,85.1 L65.2,84.7 L63.5,84.6 L59.1,85.2 L54.5,85.5 L42.8,85.3 L41.4,85.7 L38.8,87.3 L37.0,87.5 L35.4,86.8 L34.0,85.0 L32.4,83.3 L30.9,82.5 L26.4,80.6 L23.4,78.5 L23.1,78.0 L23.3,76.0 L22.8,73.5 L22.0,72.2 L20.6,70.8 L18.4,69.7 L15.3,69.3 L13.2,68.5 L11.0,66.8 L10.0,64.7 L10.0,63.4 L10.7,61.6 L11.9,60.3 L13.2,59.5 L16.4,58.5 L18.6,58.5 L22.4,59.3 L24.1,59.1 L26.4,58.0 L27.7,56.6 L28.5,55.3 L29.2,51.8 L28.7,49.1 L27.9,47.8 L25.4,45.6 L24.2,44.1 L23.1,41.5 L23.1,38.5 L24.2,35.9 L25.9,34.0 L27.9,32.9 L29.6,32.5 L31.4,32.5 L32.8,32.8 L34.6,33.7 L36.1,35.0 L37.4,37.0 L38.4,39.6 L40.1,41.6 L42.5,42.7 L44.0,42.9 L45.6,42.7 L49.8,40.9 L51.7,39.1 L52.5,37.8 L52.9,36.4 L52.9,34.1 L52.5,32.7 L54.4,33.0 L56.9,32.5 L58.3,31.7 L61.0,28.6 L62.9,27.1 L65.2,26.0 Z"/>
    <!-- the stamp -->
    <circle cx="60" cy="58" r="20" fill="#D2C6AC"/>
    <g fill="#2A2521"><circle cx="64" cy="51" r="3.5"/><circle cx="74" cy="51" r="3.5"/><rect x="63" y="64" width="10" height="3.5"/></g>
  </g>
</svg>
