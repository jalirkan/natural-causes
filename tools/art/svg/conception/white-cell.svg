<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>White cell</title>
  <desc>A big soft purple puff with a lumpy, uneven edge in a rose skin, and a round face set high and to one side: huge dark eyes gazing past you, pink cheeks, a small contented smile. It is not coming for you; it is going where it was going.</desc>
  <!--
    White cell (CONCEPTION-ROSTER 3.1), the act's elite, in the greeting-card
    register (G-053). The blot (law 11): one heavy round mass of eight lobes,
    uneven in size and spacing so it never resolves into a flower, every
    notch between them rounded (register rule 1). No tail, no limbs.
    Two tones, because they have to be. Elite purple sits 0.113 Oklab L from
    conception-deep, under CHECK's 0.12 contrast floor, so a sprite mostly
    purple vanishes into the field. The blot is conception-mid, and its body
    is the same blot eroded by the membrane, every corner rounded, and set a
    little low and right: the rose shows as an uneven skin, thickest at the
    upper left, where its one bone glint sits.
    Both are traced from the geometry: the blot is the union of the lobes
    closed by 3; the body is the blot eroded by 10.5 and opened by 3, set
    (1.5, 2.5) low and right.
    The face sits on the purple, high and right of the middle, so it looks
    past you: ink eyes a sixth of the blot across, a bone glint in each
    (paper is the player's, law 10), blush, a small contented smile.
    Colours are palette hex values: conception-mid #A86A63, threat-elite
    #7C5C8A (held by the white cell, law 11), bone #D2C6AC, blush #EBA39C,
    ink #2A2521. CONFORM adds the outline; there is none here.
  -->
