<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Pointing icon</title>
  <desc>A chubby child's hand, round as a mitten, pointing to the right: one short fat index finger held straight out, the thumb a round nub on top, three curled fingers stacked below, a sweater cuff at the wrist, one glint on the back of the hand. No face, no text.</desc>
  <!--
    Pointing (G-054; items.ts `lash`, icon "strike"). A card icon, and also
    the homing shot: the hand flies at whatever is nearest (G-036), about 30px,
    rotated to its heading (ActScene syncProjectiles), so it points along +x
    and keeps off the field's reserved colours: no threat colour, no paper,
    no act's light tone. The glint is bone, not paper, for the same reason:
    paper on a projectile is the player (law 10).
    Greeting-card register (G-053): a kid's hand, not a printer's manicule.
    The fist is one round mass, the finger short and fat, every end rounded.
    No face: a pointing hand at 30px is the gesture, and a face on it would
    make it a creature.
    CONFORM adds the outer outline. The ink between the parts is drawn as
    filled shapes under each part, clipped to the hand's own silhouette so the
    outer edge carries only the pipeline's one outline (law 1).
    Colours: conception-mid #A86A63, bone #D2C6AC, ink #2A2521.
  -->
  <defs>
    <clipPath id="hand">
      <rect x="4" y="31" width="21" height="44" rx="9"/>
      <ellipse cx="42" cy="55" rx="23" ry="21"/>
      <rect x="44" y="36" width="50" height="18" rx="9"/>
      <rect x="47" y="52" width="24" height="12" rx="6"/>
      <rect x="45" y="62" width="22" height="11.5" rx="5.75"/>
      <rect x="41" y="71" width="21" height="10.5" rx="5.25"/>
      <ellipse cx="50" cy="37.5" rx="13" ry="6.5" transform="rotate(-6 50 37.5)"/>
    </clipPath>
  </defs>
  <g shape-rendering="crispEdges">
    <!-- the sweater cuff -->
    <rect x="4" y="31" width="21" height="44" rx="9" fill="#D2C6AC"/>

    <g clip-path="url(#hand)">
      <!-- the round of the hand, with ink where it leaves the cuff -->
      <ellipse cx="42" cy="55" rx="25" ry="23" fill="#2A2521"/>
      <ellipse cx="42" cy="55" rx="23" ry="21" fill="#A86A63"/>

      <!-- the index finger, straight out -->
      <rect x="44" y="36" width="50" height="18" rx="9" fill="#A86A63"/>

      <!-- the three curled fingers, each with ink round it -->
      <rect x="45" y="50" width="28" height="16" rx="8" fill="#2A2521"/>
      <rect x="47" y="52" width="24" height="12" rx="6" fill="#A86A63"/>
      <rect x="43" y="60" width="26" height="15.5" rx="7.75" fill="#2A2521"/>
      <rect x="45" y="62" width="22" height="11.5" rx="5.75" fill="#A86A63"/>
      <rect x="39" y="69" width="25" height="14.5" rx="7.25" fill="#2A2521"/>
      <rect x="41" y="71" width="21" height="10.5" rx="5.25" fill="#A86A63"/>

      <!-- the thumb, a round nub lying along the top of the finger -->
      <ellipse cx="50" cy="37.5" rx="15" ry="8.5" transform="rotate(-6 50 37.5)" fill="#2A2521"/>
      <ellipse cx="50" cy="37.5" rx="13" ry="6.5" transform="rotate(-6 50 37.5)" fill="#A86A63"/>
    </g>

    <!-- the one glint, upper-left on the back of the hand -->
    <ellipse cx="29" cy="45" rx="3.4" ry="2.4" transform="rotate(-35 29 45)" fill="#D2C6AC"/>
  </g>
</svg>
