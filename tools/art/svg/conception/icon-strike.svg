<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Lash icon</title>
  <desc>A printed pointing hand, a manicule: the index finger held out straight to the right, the thumb laid across the side of the hand with its tip up under the index, three fingers folded beneath, and a shirt cuff at the wrist.</desc>
  <!--
    Lash (items.ts, icon "strike"). A card icon, and also Reflex's shot: the
    manicule flies at whatever is nearest (G-036), about 30px, rotated to its
    heading (ActScene syncProjectiles), so it keeps off the field's reserved
    colours: no threat colour, no paper, no conception-light. The cuff is
    bone, not paper; paper on a projectile is the player (law 10).
    It points along +x, so the heading rotation puts the fingertip first.
    Backhand (icon-sweep) is the other hand with a cuff, so this one differs
    in everything else: it lies level where that one leans into a swing, it
    shows one finger where that one shows all four, and it is flat and still,
    as printed, with no motion lines: it aims where that one is moving.
    The cuff and its opening line and button follow Backhand's, turned to
    lie along the wrist; no forearm past it.
    CONFORM adds the outer outline; interior lines are drawn here, and bone
    never meets rose without ink between them.
    Colours: conception-mid #A86A63, bone #D2C6AC, ink #2A2521.
  -->
  <defs>
    <!-- the hand's own outline, so the thumb runs out to its edge -->
    <clipPath id="hand">
      <path d="M 16 36 C 24 33 30 30 40 30 L 56 30 L 56 58 L 46 69 C 34 70 24 68 16 65 Z"/>
      <rect x="40" y="40.5" width="27" height="10" rx="5"/>
      <rect x="38" y="50" width="26" height="10" rx="5"/>
      <rect x="36" y="59.5" width="24" height="9.5" rx="4.75"/>
    </clipPath>
  </defs>
  <g shape-rendering="crispEdges">
    <!-- the back of the hand and the wrist, running under the cuff -->
    <path fill="#A86A63" d="M 16 36 C 24 33 30 30 40 30 L 56 30 L 56 58 L 46 69 C 34 70 24 68 16 65 Z"/>
    <!-- the three folded fingers, their fronts stepping back toward the heel -->
    <g fill="#A86A63">
      <rect x="40" y="40.5" width="27" height="10" rx="5"/>
      <rect x="38" y="50" width="26" height="10" rx="5"/>
      <rect x="36" y="59.5" width="24" height="9.5" rx="4.75"/>
    </g>
    <!-- the gaps between the folded fingers -->
    <g stroke="#2A2521" stroke-width="2" stroke-linecap="round">
      <line x1="40" y1="50.25" x2="61" y2="50.25"/>
      <line x1="38" y1="59.75" x2="57" y2="59.75"/>
    </g>
    <!-- the thumb, rising from the heel across the folded fingers, its tip up under the index -->
    <g clip-path="url(#hand)">
      <path fill="#A86A63" stroke="#2A2521" stroke-width="2" stroke-linejoin="round"
            d="M 26.1 77.5 L 46.9 43.4 A 6 6 0 0 1 57.1 49.6 L 36.3 83.7 Z"/>
    </g>
    <!-- the index finger, held straight out, and where it lies on the rest -->
    <rect x="44" y="30" width="52" height="11" rx="5.5" fill="#A86A63"/>
    <line x1="44" y1="41" x2="64" y2="41" stroke="#2A2521" stroke-width="2" stroke-linecap="round"/>

    <!-- the cuff, its opening, and one button -->
    <rect x="4" y="30" width="15" height="40" rx="2" fill="#D2C6AC"/>
    <line x1="18" y1="32" x2="18" y2="68" stroke="#2A2521" stroke-width="2"/>
    <circle cx="11" cy="61" r="2.2" fill="#2A2521"/>
  </g>
</svg>
