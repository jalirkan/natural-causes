<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Rival sperm</title>
  <desc>A comet: a round rose head and one wavy tail tapering behind it, big eyes fixed ahead, pink cheeks and a small pleased smile. It is racing you, and it is enjoying it.</desc>
  <!--
    Rival sperm (G-040), in the greeting-card register (G-053). The comet
    (law 11): a smooth round head and one trailing tail, which no other
    enemy has. Kid proportions: the head is most of it; the tail leaves
    from the back of it in one wave, tapering to a round tip. It faces
    right, the way the renderer flips it toward what it chases; its eyes
    sit at the front of the head and look ahead along its line, not at
    you. It is the player's sibling without the cowlick, in the rivals'
    rose.
    One mass, one bone glint at its upper left; big ink eyes with a bone
    glint each (paper is the player's, law 10); blush; a small pleased
    smile. No threat colour: the act's contact red is the spermicide's
    (reservations.ts), so the rival is rose, ink, bone and blush.
    Colours are palette hex values: conception-mid #A86A63, bone #D2C6AC,
    blush #EBA39C, ink #2A2521. CONFORM adds the outline; there is none here.
  -->
