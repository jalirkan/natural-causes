<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>The Egg, eyes closing</title>
  <desc>The same vast round cream egg in its ring of stubby teal fingers, its eyes now closed to two soft downward lashes, the same pink cheeks and knowing smile. It is letting you in.</desc>
