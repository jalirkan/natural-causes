<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player, before birth</title>
  <desc>The same big round head as in every act, with the one cowlick above the left eye, two big dark eyes with a light glint each, blush on both cheeks and a small content smile, on a plump comma of a tail that curls away behind it.</desc>
  <!--
    The player before birth (G-003, G-053; ART-DIRECTION §2026-09-28, rule 6:
    "in Conception the same head on a comma of a body"). The head group is
    player-school's markup verbatim, and the figure spans the same height as
    every later act (the cowlick's tip to the tail's lowest point, where the
    kid's feet are), so the head is the same size here as at fifty-five. The
    cowlick goes here first, where it is anatomically absurd (G-003).
    The body is one plump tail, paper, from under the head on the side the
    face looks toward, sweeping down and curling away behind, tapering to a
    round tip: the comma the head is the dot of. The chin is the head group's
    ink line, over the tail only. It owns nothing: no clothing, no
    accessories, no gear. Paper is the player's and nothing else's (law 10);
    the head and tail are paper, so they take no glint; the eyes have theirs.
    CONFORM adds the outline; there is none here, and no strokes.
    Colours are palette hex values: paper #EFE7D6, ink #2A2521, blush #EBA39C.
  -->
  <defs>
    <!-- the body the head sits on: the chin line is drawn only over it -->
    <clipPath id="body">
      <path d="M41 56 L62 56 C63 73 53 87 37 93.6 C29 97 21 98.87 15.2 97.6 A2.5 2.5 0 0 1 13.8 92.8 C20 93 29 89 35 83 C41 77 45 68 41 56 Z"/>
    </clipPath>
  </defs>
  <!-- the tail: a plump comma, curling away behind the head -->
  <path d="M41 56 L62 56 C63 73 53 87 37 93.6 C29 97 21 98.87 15.2 97.6 A2.5 2.5 0 0 1 13.8 92.8 C20 93 29 89 35 83 C41 77 45 68 41 56 Z" fill="#EFE7D6"/>
  <!-- the head: the same markup in all seven player drawings -->
  <g id="head">
    <ellipse cx="50" cy="36.9" rx="30" ry="28" fill="#2A2521" clip-path="url(#body)"/>
    <path d="M39.8 10 C39.2 6.4 41 3 44.6 1.4 C46.4 0.6 48.4 0.3 50 0.6 C50.8 0.8 50.9 1.5 50.3 1.9 C48 3.1 46.6 4.6 46 6.2 C45.6 7.4 45.6 8.6 45.9 10 Z" fill="#2A2521"/>
    <ellipse cx="50" cy="35" rx="30" ry="28" fill="#EFE7D6"/>
    <ellipse cx="42.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <ellipse cx="63.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <circle cx="40.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <circle cx="61.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <ellipse cx="36.3" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <ellipse cx="69.7" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <path d="M50.2 48.2 C50.6 47.6 51.4 47.7 51.7 48.3 C52.6 50 55 50 55.9 48.3 C56.2 47.7 57 47.6 57.4 48.2 C57.7 48.6 57.6 49 57.3 49.5 C55.9 52.2 51.7 52.2 50.3 49.5 C50 49 49.9 48.6 50.2 48.2 Z" fill="#2A2521"/>
  </g>
</svg>
