<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Spilt Milk icon</title>
  <desc>Spilt milk seen from above: one big splat of milk thrown out every way at once, uneven splashes reaching out from its edge, some long and thin, some short and fat, each ending round, and drops let go of flying off beyond them; a sippy cup tipped over on its side at the lower left with its spout in the milk, the lid and spout darker, a small surprised face on the cup with blush cheeks and a round little mouth. No text.</desc>
  <!--
    Spilt Milk (G-054; items.ts `acrosome`, icon "burst"). A card icon, and
    also what pops around the player on the field: drawn at 1.7x the burst
    radius at 0.75 alpha, unrotated (ActScene syncAreas), and G-054 makes it
    a puddle that slows too, so the splat is the mass and it reaches every
    way at once. It keeps off the field's reserved colours: no threat colour,
    no paper (the milk is bone: paper on the field is the player, law 10),
    no act's light tone.
    The milk is bone, the lightest colour a rider may wear, so it carries no
    separate glint (nothing lighter is legal on it); the cup's glint is bone
    on rose. The cup is off to one side so the player, drawn over the
    splat's middle, never covers it.
    Liquid is said by unevenness: splashes of different lengths and widths,
    drops stretched along the way they fly. Round lobes on a round pool read
    as a cloud, and even spikes with round ends as a germ.
    No handles: two read as ears and one on top as a padlock's shackle;
    the spout is what says sippy cup.
    Its face is the kid's "oops": faintly worried, round-mouthed, never upset.
    CONFORM adds the outer outline. The ink round the cup, where it lies in
    the milk, is drawn here, clipped to the whole silhouette so the outer
    edge keeps the pipeline's one outline (law 1).
    Colours: bone #D2C6AC, conception-mid #A86A63, conception-deep #6B3A44,
    blush #EBA39C, ink #2A2521.
  -->
  <defs>
    <clipPath id="whole">
      <circle cx="57" cy="45" r="20"/>
      <circle cx="58.4" cy="37.1" r="14"/>
      <circle cx="66.4" cy="41.6" r="14"/>
      <circle cx="63.9" cy="50.8" r="13"/>
      <circle cx="53.6" cy="52.3" r="12"/>
      <circle cx="48.0" cy="44.2" r="12"/>
      <circle cx="52.5" cy="37.2" r="13"/>
      <polygon points="59.2,29.0 50.2,9.7 46.5,10.6 47.5,31.9"/>
      <circle cx="47.8" cy="8.1" r="4.2"/>
      <polygon points="72.9,38.4 77.1,26.8 69.8,21.1 59.5,27.9"/>
      <circle cx="75.5" cy="21.4" r="6.5"/>
      <polygon points="72.8,49.3 94.4,42.0 93.8,37.6 70.9,36.5"/>
      <circle cx="96.6" cy="39.4" r="5.0"/>
      <polygon points="65.4,58.6 78.6,64.4 81.1,61.3 72.2,49.9"/>
      <circle cx="81.4" cy="64.1" r="4.0"/>
      <polygon points="49.5,60.3 53.5,71.1 62.3,70.8 65.5,59.7"/>
      <circle cx="58.0" cy="74.0" r="6.0"/>
      <polygon points="41.8,39.5 25.2,44.0 25.4,48.2 42.2,51.5"/>
      <circle cx="23.0" cy="46.2" r="4.6"/>
      <polygon points="51.1,30.2 33.4,16.3 30.9,18.6 42.9,37.5"/>
      <circle cx="30.9" cy="16.0" r="3.8"/>
      <ellipse cx="65.5" cy="4.9" rx="4.2" ry="2.6" transform="rotate(-78 65.5 4.9)"/>
      <ellipse cx="92.5" cy="24.5" rx="3.4" ry="2.2" transform="rotate(-30 92.5 24.5)"/>
      <ellipse cx="92.9" cy="54.0" rx="2.6" ry="2.0" transform="rotate(14 92.9 54.0)"/>
      <ellipse cx="74.8" cy="78.6" rx="4.0" ry="2.5" transform="rotate(62 74.8 78.6)"/>
      <ellipse cx="21.7" cy="28.5" rx="3.6" ry="2.3" transform="rotate(205 21.7 28.5)"/>
      <path d="M -18.00 -5.50 Q -18.00 -10.50 -13.03 -11.02 L 1.03 -12.48 Q 6.00 -13.00 6.00 -8.00 L 6.00 8.00 Q 6.00 13.00 1.03 12.48 L -13.03 11.02 Q -18.00 10.50 -18.00 5.50 Z" transform="translate(22 77) rotate(-32)"/>
      <rect x="4.5" y="-14.5" width="8" height="29" rx="3.5" transform="translate(22 77) rotate(-32)"/>
      <path d="M 10 -12.5 L 20 -11 Q 26 -10 26 -7.5 Q 26 -5 20 -4.2 L 10 -3 Z" transform="translate(22 77) rotate(-32)"/>
    </clipPath>
  </defs>
  <g shape-rendering="crispEdges">
    <!-- the milk -->
    <g fill="#D2C6AC">
      <circle cx="57" cy="45" r="20"/>
      <circle cx="58.4" cy="37.1" r="14"/>
      <circle cx="66.4" cy="41.6" r="14"/>
      <circle cx="63.9" cy="50.8" r="13"/>
      <circle cx="53.6" cy="52.3" r="12"/>
      <circle cx="48.0" cy="44.2" r="12"/>
      <circle cx="52.5" cy="37.2" r="13"/>
      <polygon points="59.2,29.0 50.2,9.7 46.5,10.6 47.5,31.9"/>
      <circle cx="47.8" cy="8.1" r="4.2"/>
      <polygon points="72.9,38.4 77.1,26.8 69.8,21.1 59.5,27.9"/>
      <circle cx="75.5" cy="21.4" r="6.5"/>
      <polygon points="72.8,49.3 94.4,42.0 93.8,37.6 70.9,36.5"/>
      <circle cx="96.6" cy="39.4" r="5.0"/>
      <polygon points="65.4,58.6 78.6,64.4 81.1,61.3 72.2,49.9"/>
      <circle cx="81.4" cy="64.1" r="4.0"/>
      <polygon points="49.5,60.3 53.5,71.1 62.3,70.8 65.5,59.7"/>
      <circle cx="58.0" cy="74.0" r="6.0"/>
      <polygon points="41.8,39.5 25.2,44.0 25.4,48.2 42.2,51.5"/>
      <circle cx="23.0" cy="46.2" r="4.6"/>
      <polygon points="51.1,30.2 33.4,16.3 30.9,18.6 42.9,37.5"/>
      <circle cx="30.9" cy="16.0" r="3.8"/>
      <ellipse cx="65.5" cy="4.9" rx="4.2" ry="2.6" transform="rotate(-78 65.5 4.9)"/>
      <ellipse cx="92.5" cy="24.5" rx="3.4" ry="2.2" transform="rotate(-30 92.5 24.5)"/>
      <ellipse cx="92.9" cy="54.0" rx="2.6" ry="2.0" transform="rotate(14 92.9 54.0)"/>
      <ellipse cx="74.8" cy="78.6" rx="4.0" ry="2.5" transform="rotate(62 74.8 78.6)"/>
      <ellipse cx="21.7" cy="28.5" rx="3.6" ry="2.3" transform="rotate(205 21.7 28.5)"/>
    </g>

    <!-- the cup, tipped over, spout in the milk -->
    <g clip-path="url(#whole)">
      <g transform="translate(22 77) rotate(-32)">
        <!-- ink round the whole cup, where it lies on the milk -->
        <g fill="#2A2521">
          <path d="M -19.60 -5.50 Q -19.60 -12.10 -13.03 -12.75 L 1.03 -14.15 Q 7.60 -14.80 7.60 -8.20 L 7.60 8.20 Q 7.60 14.80 1.03 14.15 L -13.03 12.75 Q -19.60 12.10 -19.60 5.50 Z"/>
          <rect x="2.9" y="-16.1" width="11.2" height="32.2" rx="5.1"/>
          <path d="M 8.4 -14.1 L 20 -12.6 Q 27.6 -11.4 27.6 -7.5 Q 27.6 -3.6 20 -2.6 L 8.4 -1.4 Z"/>
        </g>
        <!-- the body -->
        <path d="M -19.60 -5.50 Q -19.60 -12.10 -13.03 -12.75 L 1.03 -14.15 Q 7.60 -14.80 7.60 -8.20 L 7.60 8.20 Q 7.60 14.80 1.03 14.15 L -13.03 12.75 Q -19.60 12.10 -19.60 5.50 Z" fill="#2A2521"/>
        <path d="M -18.00 -5.50 Q -18.00 -10.50 -13.03 -11.02 L 1.03 -12.48 Q 6.00 -13.00 6.00 -8.00 L 6.00 8.00 Q 6.00 13.00 1.03 12.48 L -13.03 11.02 Q -18.00 10.50 -18.00 5.50 Z" fill="#A86A63"/>
        <!-- the spout, then the lid over its root -->
        <path d="M 10 -12.5 L 20 -11 Q 26 -10 26 -7.5 Q 26 -5 20 -4.2 L 10 -3 Z" fill="#6B3A44"/>
        <rect x="2.9" y="-16.1" width="11.2" height="32.2" rx="5.1" fill="#2A2521"/>
        <rect x="4.5" y="-14.5" width="8" height="29" rx="3.5" fill="#6B3A44"/>

        <!-- the cup's one glint, upper left as it lies -->
        <ellipse cx="-8.5" cy="-8.8" rx="2.6" ry="1.6" fill="#D2C6AC"/>
        <!-- the face: eyes with a glint each, blush, a round little mouth -->
        <ellipse cx="-10.5" cy="-1.8" rx="2.6" ry="3.3" fill="#2A2521"/>
        <ellipse cx="-2.5" cy="-1.8" rx="2.6" ry="3.3" fill="#2A2521"/>
        <circle cx="-11.4" cy="-3" r="1" fill="#D2C6AC"/>
        <circle cx="-3.4" cy="-3" r="1" fill="#D2C6AC"/>
        <ellipse cx="-14.4" cy="3.6" rx="2.5" ry="1.5" fill="#EBA39C"/>
        <ellipse cx="1.4" cy="3.6" rx="2.5" ry="1.5" fill="#EBA39C"/>
        <ellipse cx="-6.5" cy="5.4" rx="1.7" ry="2.1" fill="#2A2521"/>
      </g>
    </g>
  </g>
</svg>
