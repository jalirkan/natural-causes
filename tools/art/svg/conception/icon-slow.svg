<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Snooze icon</title>
  <desc>A round bedside clock with one wide bar across its top instead of bells, its hands at nine minutes to the hour, and a z rising off it.</desc>
  <!--
    Snooze (items.ts, icon "slow"). A card icon, and also the mark dropped
    at the centre of its field on the field (ActScene syncAreas, 40px), so it
    keeps off the field's reserved colours: no threat colour, no paper, no
    conception-light.
    No bells: the twin-bell alarm clock is Capacitation's (icon-clock). This
    one wears the snooze bar where the bells would be, and the z. A digital
    bedside clock was drawn first and read as a kitchen scale at card size;
    a round face with hands is what says clock at 40px.
    The minute hand stands at nine minutes to: nine more minutes.
    The z is drawn as a shape, not set as a letter (CHECK forbids text).
    CONFORM adds the outer outline; the hands are drawn here.
    Colours: conception-mid #A86A63, bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges">
    <!-- the snooze bar, bone, across the top where the bells would be -->
    <rect x="22" y="20" width="38" height="13" rx="4" fill="#D2C6AC"/>
    <!-- two short feet -->
    <g fill="#A86A63">
      <rect x="15" y="80" width="12" height="15" rx="4" transform="rotate(30 21 87)"/>
      <rect x="57" y="80" width="12" height="15" rx="4" transform="rotate(-30 63 87)"/>
    </g>
    <!-- the case and the face -->
    <circle cx="42" cy="60" r="32" fill="#A86A63"/>
    <circle cx="42" cy="60" r="23" fill="#D2C6AC"/>
    <!-- the hands: nine minutes to, the hour most of the way to seven -->
    <g stroke="#2A2521" stroke-linecap="round">
      <line x1="42" y1="60" x2="26.6" y2="48.8" stroke-width="4"/>
      <line x1="42" y1="60" x2="36.5" y2="71.7" stroke-width="5"/>
    </g>
    <circle cx="42" cy="60" r="3.5" fill="#2A2521"/>

    <!-- the z, rising off the top right: a shape, not a letter -->
    <polygon fill="#D2C6AC"
      points="66,4 95,4 95,11 77.5,25 95,25 95,32 66,32 66,25 83.5,11 66,11"/>
  </g>
</svg>
