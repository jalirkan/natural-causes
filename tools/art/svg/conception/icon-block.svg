<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Calendar Block icon</title>
  <desc>One wall-calendar page seen straight on: two binder rings standing up off its top edge, a solid header band, and a grid of nine plain day cells below it, the middle one filled in and struck through.</desc>
  <!--
    Calendar Block (items.ts, mode "field" with `wall`; G-048, The Office's
    first item). A card icon, and also the mark at the centre of its hold on
    the field (ActScene syncHolds, 40px), so it keeps off the field's
    reserved colours: no threat colour, no paper, no act's light tone. Above
    all no elite purple: the meeting's chairs wear it, and this ring is the
    meeting's wall turned inside out, so the two must never be confused.
    Nine cells, not a month: at 40px a week of seven columns is a texture,
    and three by three still says calendar with the header band and rings.
    No numerals: CHECK forbids text, and the card prints the figures.
    The one blocked day is rose, filled in, with a single ink strike through
    it corner to corner: the day nobody can book.
    CONFORM adds the outer outline; the interior lines are drawn here.
    Colours: conception-mid #A86A63, bone #D2C6AC, ink #2A2521.
  -->
  <defs>
    <clipPath id="page">
      <rect x="18" y="16" width="64" height="78" rx="6"/>
    </clipPath>
  </defs>
  <!-- A page taller than it is wide, as a wall calendar hangs: square, it
       filled 0.81 of its trimmed frame and CHECK's silhouette-area refused it. -->
  <g shape-rendering="crispEdges">
    <!-- the sheet, bone -->
    <rect x="18" y="16" width="64" height="78" rx="6" fill="#D2C6AC"/>
    <!-- the header band, rose, across the top of the sheet -->
    <rect x="18" y="16" width="64" height="20" fill="#A86A63" clip-path="url(#page)"/>
    <!-- an ink line where the band meets the sheet -->
    <line x1="18" y1="36" x2="82" y2="36" stroke="#2A2521" stroke-width="2.4"/>

    <!-- the blocked day, the middle cell, rose -->
    <rect x="39.3" y="55.3" width="21.4" height="19.4" fill="#A86A63"/>

    <!-- the cell lines, ink: two across, two down -->
    <g stroke="#2A2521" stroke-width="2.4" stroke-linecap="butt">
      <line x1="18" y1="55.3" x2="82" y2="55.3"/>
      <line x1="18" y1="74.7" x2="82" y2="74.7"/>
      <line x1="39.3" y1="36" x2="39.3" y2="94"/>
      <line x1="60.7" y1="36" x2="60.7" y2="94"/>
    </g>

    <!-- the strike through the blocked day, corner to corner -->
    <line x1="41.3" y1="72.7" x2="58.7" y2="57.3" stroke="#2A2521" stroke-width="4.5" stroke-linecap="round"/>

    <!-- the two binder rings, bone, standing up off the top edge -->
    <g fill="#D2C6AC">
      <rect x="28" y="4" width="9" height="22" rx="4.5"/>
      <rect x="63" y="4" width="9" height="22" rx="4.5"/>
    </g>
    <!-- where each ring passes into the band -->
    <g stroke="#2A2521" stroke-width="2" fill="none">
      <line x1="28" y1="16" x2="37" y2="16"/>
      <line x1="63" y1="16" x2="72" y2="16"/>
    </g>
  </g>
</svg>
