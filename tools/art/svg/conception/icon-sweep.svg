<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Rattle icon</title>
  <desc>A baby rattle lying on its side: a big round head with a pleased face on the right, a short fat handle running left from a little collar, and a ring on the end of the handle to hold it by.</desc>
  <!--
    Rattle (G-054; items.ts id backhand, mode sweep, icon "sweep"). A card
    icon, and also what the sweep carries across its arc on the field
    (ActScene syncSweeps, 36px, turned to the swing's radial angle), so the
    handle points at the player and the head swings out at the crowd: drawn
    lying along +x, head outermost. It keeps off the field's reserved
    colours: no threat colour, no paper, no act's light tone, so the one
    glint on each mass is bone, the lightest colour a rider may wear.
    Greeting-card register (ART-DIRECTION 2026-09-28): the head is the mass,
    round, with big ink eyes, one glint each, blush cheeks and a small smile;
    the handle is stubby, kid proportions.
    CONFORM adds the one outline; there are no strokes here.
    Colours: conception-mid #A86A63, blush #EBA39C, bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges">
    <!-- the ring on the end of the handle, with its hole -->
    <path fill="#D2C6AC" fill-rule="evenodd" d="M 2 50 A 12.5 12.5 0 1 0 27 50 A 12.5 12.5 0 1 0 2 50 Z M 8 50 A 6.5 6.5 0 1 0 21 50 A 6.5 6.5 0 1 0 8 50 Z"/>
    <!-- the handle, short and fat -->
    <rect x="22" y="43" width="26" height="14" rx="7" fill="#D2C6AC"/>
    <!-- the collar where the handle goes into the head -->
    <ellipse cx="44" cy="50" rx="5.5" ry="11.5" fill="#EBA39C"/>
    <!-- the head -->
    <circle cx="70" cy="50" r="27" fill="#A86A63"/>
    <!-- one shadow tone, low on the far side -->
    <path fill="#6B3A44" d="M 94.6 39 A 27 27 0 0 1 58 74.2 A 36 36 0 0 0 94.6 39 Z"/>
    <!-- its one glint -->
    <ellipse cx="54" cy="35" rx="2.7" ry="1.9" transform="rotate(-40 54 35)" fill="#D2C6AC"/>
    <!-- the face: eyes with one glint each, blush cheeks, a small smile -->
    <ellipse cx="61" cy="47" rx="4.8" ry="6" fill="#2A2521"/>
    <ellipse cx="79" cy="47" rx="4.8" ry="6" fill="#2A2521"/>
    <circle cx="59.6" cy="44.6" r="1.7" fill="#D2C6AC"/>
    <circle cx="77.6" cy="44.6" r="1.7" fill="#D2C6AC"/>
    <ellipse cx="55" cy="57" rx="4.4" ry="2.8" fill="#EBA39C"/>
    <ellipse cx="85" cy="57" rx="4.4" ry="2.8" fill="#EBA39C"/>
    <path fill="#2A2521" d="M 64.5 55.5 Q 70 64 75.5 55.5 Q 70 60 64.5 55.5 Z"/>
  </g>
</svg>
