<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Charisma icon</title>
  <desc>A classroom horseshoe magnet seen flat, the bend at the top and its two pale pole tips pointing down.</desc>
  <!--
    Charisma (items.ts chemotaxis, icon "pull"). A card icon, and also what
    is planted on the field where the crowd is pulled (ActScene syncAreas,
    40px under a contracting ring), so it keeps off the field's reserved
    colours: no threat colour, no paper, no conception-light. The generated
    one it replaces was brick red, which quantised to contact red and made
    the player's own pull read as a threat (law 10).
    The arms run well below the bend and the opening stays wide, so the U
    never closes into a ring: the ring is the spermicide's (law 11).
    CONFORM adds the outer outline; interior lines are drawn here.
    Colours: conception-mid #A86A63, bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges">
    <!-- the horseshoe: a semicircular bend over two straight arms -->
    <path fill="#A86A63" d="M 10 44 A 40 40 0 0 1 90 44 L 90 94 L 68 94 L 68 44 A 18 18 0 0 0 32 44 L 32 94 L 10 94 Z"/>

    <!-- the pole tips: pale, square, the full width of each arm -->
    <g fill="#D2C6AC">
      <rect x="10" y="77" width="22" height="17"/>
      <rect x="68" y="77" width="22" height="17"/>
    </g>

    <!-- the ink line where each tip meets its arm -->
    <g fill="#2A2521">
      <rect x="10" y="74" width="22" height="3.5"/>
      <rect x="68" y="74" width="22" height="3.5"/>
    </g>
  </g>
</svg>
