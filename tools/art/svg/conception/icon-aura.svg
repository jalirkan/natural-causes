<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Cooties icon</title>
  <desc>The playground cootie shot, circle, circle, dot, dot: one fat round ring with two big dots inside it, which make a pleased little face with blush cheeks and a small smile.</desc>
  <!--
    Cooties (G-054; items.ts id personal-space, mode aura, icon "aura"). A
    card icon, and also what rides the aura ring round the player on the
    field (ActScene syncAuras, 32px, never turned): whatever stands too
    close catches it. It keeps off the field's reserved colours: no threat
    colour, no paper, no act's light tone, so the ring's one glint is bone,
    the lightest colour a rider may wear.
    The ring is the mass and the two dots are the eyes, so the shot is a
    face in the greeting-card register (ART-DIRECTION 2026-09-28): big ink
    dots with one glint each, blush cheeks, a small smile, one shadow tone
    low on the ring's far side. Inside the ring is bone, not left open, so
    the dots read on the ink card and on any ground.
    CONFORM adds the one outline; there are no strokes here.
    Colours: conception-mid #A86A63, conception-deep #6B3A44, blush #EBA39C,
    bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges">
    <!-- the ring -->
    <circle cx="50" cy="50" r="46" fill="#A86A63"/>
    <!-- one shadow tone, low on the far side of the ring -->
    <path fill="#6B3A44" d="M 93.2 34.3 A 46 46 0 0 1 34.3 93.2 A 53 53 0 0 0 93.2 34.3 Z"/>
    <!-- its one glint -->
    <ellipse cx="21.2" cy="23.7" rx="3.4" ry="2.2" transform="rotate(-45 21.2 23.7)" fill="#D2C6AC"/>
    <!-- inside the ring -->
    <circle cx="50" cy="50" r="35" fill="#D2C6AC"/>
    <!-- dot, dot: the eyes, with one glint each -->
    <ellipse cx="39" cy="46" rx="6.2" ry="7.6" fill="#2A2521"/>
    <ellipse cx="61" cy="46" rx="6.2" ry="7.6" fill="#2A2521"/>
    <circle cx="37" cy="42.8" r="2.2" fill="#D2C6AC"/>
    <circle cx="59" cy="42.8" r="2.2" fill="#D2C6AC"/>
    <!-- blush cheeks and a small smile -->
    <ellipse cx="29.5" cy="58" rx="5" ry="3.1" fill="#EBA39C"/>
    <ellipse cx="70.5" cy="58" rx="5" ry="3.1" fill="#EBA39C"/>
    <path fill="#2A2521" d="M 44 58 Q 50 66.5 56 58 Q 50 62 44 58 Z"/>
  </g>
</svg>
