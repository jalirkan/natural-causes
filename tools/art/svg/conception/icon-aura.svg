<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Personal Space icon</title>
  <desc>A velvet rope barrier seen straight on: two short stanchion posts with round finials and flat round bases, and one rope drooping between them in a single sag.</desc>
  <!--
    Personal Space (items.ts, mode "aura"; G-044). A card icon, and also what
    rides the aura ring on the field (about 32px), so it keeps off the
    field's reserved colours: no threat colour, no paper, no conception-light.
    The rope says keep your distance, and says it politely.
    Posts bone, rope rose, not the reverse: the posts are the thin parts and
    carry the silhouette, so they take the colour furthest from both grounds
    (bone sits 0.42 L above conception-deep and 0.56 above the ink card);
    the rope is the one thick stroke, and rose still clears the field by 0.18.
    The rope is clipped to the gap between the posts so it hooks onto their
    inner faces rather than passing behind them; its brass ends are bone.
    CONFORM adds the outer outline; interior lines are drawn here.
    Colours: conception-mid #A86A63, bone #D2C6AC, ink #2A2521.
  -->
  <defs>
    <!-- the gap between the posts: the rope and its brass ends live only here -->
    <clipPath id="between">
      <rect x="22.6" y="0" width="54.8" height="100"/>
    </clipPath>
  </defs>
  <g shape-rendering="crispEdges">
    <!-- the rope: one fat sag, hooked to the inner face of each post -->
    <g clip-path="url(#between)" fill="none" stroke-width="14" stroke-linecap="butt">
      <path d="M 20 37 C 36 77, 64 77, 80 37" stroke="#A86A63"/>
      <!-- the brass ends, and an ink band where the velvet starts -->
      <path d="M 20 37 C 36 77, 64 77, 80 37" stroke="#D2C6AC" stroke-dasharray="11 400"/>
      <path d="M 80 37 C 64 77, 36 77, 20 37" stroke="#D2C6AC" stroke-dasharray="11 400"/>
      <path d="M 20 37 C 36 77, 64 77, 80 37" stroke="#2A2521" stroke-dasharray="0 11 2.2 400"/>
      <path d="M 80 37 C 64 77, 36 77, 20 37" stroke="#2A2521" stroke-dasharray="0 11 2.2 400"/>
    </g>

    <!-- the stanchions: a flat round base, a post that narrows as it rises, a cap, a ball -->
    <g fill="#D2C6AC">
      <path d="M 5 88 L 5 85 C 5 80.5 10 78.5 18 78.5 C 26 78.5 31 80.5 31 85 L 31 88 Z"/>
      <polygon points="12.5,80 23.5,80 22.5,34 13.5,34"/>
      <rect x="11" y="29.5" width="14" height="6" rx="2"/>
      <circle cx="18" cy="23" r="8"/>
      <path d="M 69 88 L 69 85 C 69 80.5 74 78.5 82 78.5 C 90 78.5 95 80.5 95 85 L 95 88 Z"/>
      <polygon points="76.5,80 87.5,80 86.5,34 77.5,34"/>
      <rect x="75" y="29.5" width="14" height="6" rx="2"/>
      <circle cx="82" cy="23" r="8"/>
    </g>

    <!-- the interior lines: under each ball, under each cap, where each post
         meets its base, and down the inner face of each post where the rope hooks on -->
    <g fill="none" stroke="#2A2521" stroke-width="2.2" stroke-linecap="butt">
      <path d="M 13.34 29.5 A 8 8 0 0 0 22.66 29.5"/>
      <path d="M 77.34 29.5 A 8 8 0 0 0 86.66 29.5"/>
      <line x1="13.5" y1="35.5" x2="22.5" y2="35.5"/>
      <line x1="77.5" y1="35.5" x2="86.5" y2="35.5"/>
      <line x1="12.5" y1="79.5" x2="23.5" y2="79.5"/>
      <line x1="76.5" y1="79.5" x2="87.5" y2="79.5"/>
      <line x1="22.6" y1="36" x2="22.6" y2="58"/>
      <line x1="77.4" y1="36" x2="77.4" y2="58"/>
    </g>
  </g>
</svg>
