<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Tattle icon</title>
  <desc>A round speech bubble with one fat exclamation mark in it and a small tail at its lower left: somebody is telling on somebody.</desc>
  <!--
    Tattle (G-054; items.ts id judgement, mode strike, icon "bolt"). A card
    icon, and also what comes down on one enemy on the field (ActScene
    syncAreas: it drops from above during the telegraph at 36px and sits on
    the spot at 40px, never turned), so it is drawn upright with its tail
    pointing down at whoever it is about. It keeps off the field's reserved
    colours: no threat colour, no paper, no act's light tone, so the bubble's
    one glint is bone, the lightest colour a rider may wear.
    Greeting-card register (ART-DIRECTION 2026-09-28): one round mass, one
    glint upper-left, one shadow tone low on its far side. No face: the
    bubble is what was said, and the exclamation mark is the one glyph the
    register allows, here only. Adolescence's group chat is a speech bubble
    with a face; this one is blush with a glyph and no face.
    CONFORM adds the one outline; there are no strokes here.
    Colours: blush #EBA39C, conception-mid #A86A63, bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges">
    <!-- the tail, low on the left -->
    <path fill="#EBA39C" d="M 38 76 C 34 83.5, 27 89, 17.5 91.8 C 14.8 92.6, 13.6 90.6, 15.3 89 C 20 84, 22.5 77.5, 22.5 68 Z"/>
    <!-- the bubble -->
    <ellipse cx="53" cy="44" rx="42" ry="38" fill="#EBA39C"/>
    <!-- one shadow tone, low on the far side -->
    <path fill="#A86A63" d="M 94.07 36.08 A 42 38 0 0 1 60.29 81.42 A 55 50 0 0 0 94.07 36.08 Z"/>
    <!-- its one glint -->
    <ellipse cx="26" cy="22" rx="3.8" ry="2.5" transform="rotate(-40 26 22)" fill="#D2C6AC"/>
    <!-- the exclamation mark: a fat tapering bar and a round dot -->
    <path fill="#2A2521" d="M 45.5 21 C 45.5 13, 60.5 13, 60.5 21 L 57.2 46 C 56.7 51, 49.3 51, 48.8 46 Z"/>
    <circle cx="53" cy="62" r="6.5" fill="#2A2521"/>
  </g>
</svg>
