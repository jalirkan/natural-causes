<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Strongly Worded Letter icon</title>
  <desc>One flat sheet of writing paper, taller than wide, tipped a little to the left as if just sent: a short line of greeting at the top left, a block of four heavy lines of writing, the last of them underlined twice, and a short signature at the bottom right.</desc>
  <!--
    Strongly Worded Letter (items.ts id strongly-worded-letter, icon
    "letter"; G-050, mode "strike"). A card icon, and also what comes down on
    the mark during the telegraph (~36px) and sits on the landing (~40px) on
    the field, through the same syncAreas code as Judgement's gavel, so it
    keeps off the field's reserved colours: no threat colour, no paper, no
    act light tone.
    It rides Family's field, and Family reserves two kinds of post: the
    windowed envelope (the bill) and the sealed letter (the HOA letter, "the
    only seal, and the only thing folded"). So this is neither: one flat
    sheet, never an envelope, no fold, no dog-ear, no seal, no stamp, and in
    the player's rose where the act's post is bone.
    What makes it a letter and not a form is the layout: a short greeting
    top left, a block, a short signature bottom right. What makes it strongly
    worded is the block: heavy lines, and the last one underlined twice in
    ink, hard. Nothing legible is written: the lines are lines.
    Tipped eight degrees to the left, as if just sent; upright it read as a
    notice on a wall.
    CONFORM adds the outer outline; the underline is the only interior ink.
    Colours: conception-mid #A86A63, bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges" transform="rotate(-8 50 50)">
    <!-- the sheet -->
    <rect x="22" y="10" width="56" height="80" fill="#A86A63"/>

    <!-- the greeting: short, top left -->
    <rect x="29" y="18" width="20" height="5" fill="#D2C6AC"/>

    <!-- the block: four heavy lines of writing -->
    <g fill="#D2C6AC">
      <rect x="29" y="30" width="42" height="6"/>
      <rect x="29" y="41" width="39" height="6"/>
      <rect x="29" y="52" width="42" height="6"/>
      <rect x="29" y="63" width="34" height="6"/>
    </g>
    <!-- underlined twice, hard -->
    <g fill="#2A2521">
      <rect x="28" y="71" width="37" height="4"/>
      <rect x="28" y="77" width="37" height="4"/>
    </g>

    <!-- the signature: short, bottom right -->
    <rect x="55" y="84" width="16" height="4" fill="#D2C6AC"/>
  </g>
</svg>
