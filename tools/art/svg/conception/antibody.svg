<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Antibody</title>
  <desc>A stubby capital Y in glossy ink, straight-sided with rounded corners, a round cream face at its fork: two dark eyes, pink cheeks, a small smile. It holds on to you, and it is pleased to.</desc>
  <!--
    Antibody (CONCEPTION-ROSTER 3.3, G-018), in the greeting-card register
    (G-053). The Y is the act's reserved straight line (law 11), so its sides
    stay ruled (the ruled clause, G-013) and only its corners round: every
    corner, convex or concave, is an arc tangent to both its edges (register
    rule 1). Stubby: short arms and stem of even weight. Flat ink, not
    shadow: shadow sits 0.093 Oklab L from conception-deep, under CHECK's
    contrast floor, and a Y that vanishes into the field is no Y.
    At the fork, the tag it always had, now a round face (law 5): a bone
    disc, two ink eyes two by three with a bone glint at the top left of
    each, a blush under each, a small smile, pleased to be here. Drawn on
    the sprite's own grid, one unit to about one pixel of the 44px sprite
    (42 units, 44 less the outline); the fit lands within a pixel, not on
    it, so every feature but the eye glints is two pixels or more. A
    one-pixel mouth read as a nose, and the face as a skull. One bone
    glint on the ink mass, on the upper-left arm (paper is the player's,
    law 10).
    Colours are palette hex values: ink #2A2521, bone #D2C6AC, blush #EBA39C.
    CONFORM adds the outline; there is none here.
  -->
  <g transform="translate(0.78125 0.78125) scale(2.34375)">
  <path d="M1.2 0 L11.89 0 A1.5 1.5 0 0 1 13.1 0.62 L19.79 9.82 A1.5 1.5 0 0 0 22.21 9.82 L28.9 0.62 A1.5 1.5 0 0 1 30.11 0 L40.8 0 A1.2 1.2 0 0 1 42 1.2 L42 2.51 A1.5 1.5 0 0 1 41.71 3.39 L27.29 23.25 A1.5 1.5 0 0 0 27 24.13 L27 39.5 A2.5 2.5 0 0 1 24.5 42 L17.5 42 A2.5 2.5 0 0 1 15 39.5 L15 24.13 A1.5 1.5 0 0 0 14.71 23.25 L0.29 3.39 A1.5 1.5 0 0 1 0 2.51 L0 1.2 A1.2 1.2 0 0 1 1.2 0 Z" fill="#2A2521"/>
  <rect x="4" y="3" width="2" height="2" fill="#D2C6AC"/>
  <circle cx="21" cy="18" r="6" fill="#D2C6AC"/>
  <rect x="17" y="16" width="2" height="3" fill="#2A2521"/>
  <rect x="23" y="16" width="2" height="3" fill="#2A2521"/>
  <rect x="17" y="16" width="1" height="1" fill="#D2C6AC"/>
  <rect x="23" y="16" width="1" height="1" fill="#D2C6AC"/>
  <rect x="16" y="19" width="2" height="1" fill="#EBA39C"/>
  <rect x="24" y="19" width="2" height="1" fill="#EBA39C"/>
  <path d="M18.7 20 H19.9 V21 H22.1 V20 H23.3 V21.2 Q23.3 22.2 22.3 22.2 H19.7 Q18.7 22.2 18.7 21.2 Z" fill="#2A2521"/>
  </g>
</svg>
