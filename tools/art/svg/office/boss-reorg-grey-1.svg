<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384">
  <title>The Reorg, one row greyed</title>
  <desc>The same org chart as The Reorg, after its first restructure: ten boxes in four rows of one, two, three and four, widening toward the bottom, joined by straight ruled connector lines. The bottom row of four has gone grey: those boxes are a flat warm grey-brown instead of teal, each still with its small deadpan face, gone pale, and its bone label bar, still hung from the same connectors. The five boxes above them are teal with ink faces, and the box at the top is empty: a frame with nothing in it.</desc>
  <!--
    D-029: a variant frame. Holder: boss-reorg
    (tools/art/svg/office/boss-reorg.svg). It reserves nothing of its own
    (law 11: one silhouette, one holder); it is the holder's drawing in
    another state, and the renderer swaps the chart to it at the first restructure,
    where AUDIT 55's render tint stood.

    Grey: row 4, the bottom row, four boxes. Rows 1 to 3 are the
    holder's.

    What greys, in each greyed box and nowhere else: the box's fill, teal
    #2F7370 to shadow #6E6353, the warm grey-brown, as one flat fill and not
    a shading tone; and its face, the two eyes and the mouth, ink to bone.
    Every other element below is the holder's, byte for byte: the
    connectors, teal and still attached (G-004: damaged boxes go grey and
    stay in the chart); the empty top box, which never greys; every label
    bar, bone as it was; and every teal box's ink face.

    Why the face goes bone. G-004 keeps the face in the chart with the box,
    and eyes and a mouth in the box's own grey-brown would be no face at
    all. Ink faces were drawn first and the third frame failed CHECK with
    them: 0.4022 of the sprite within 0.12 of office-deep, where 0.4 is
    allowed. The grey-brown fill sits 0.10 from office-deep and ink only
    0.13, so the grain drops some of the ink in with it. Bone faces measure
    0.3976. A pale face on a grey box is the lighter reading of grey the
    palette has, and all three frames wear it, so a greyed box looks the
    same in each.

    The three frames step one row at a time, each identical to the one
    before except for the row it adds, so a swap moves nothing but colour.
    The holder's comment follows as it stands, the geometry and the row cuts
    (y 132/236/340 of 384) with it; its "no shadow tone" means no shading,
    which still holds.
    Colours: threat-boss #2F7370, ink #2A2521, bone #D2C6AC, shadow #6E6353.
  -->
  <!--
    The Reorg (OFFICE-ROSTER section 4, G-004): an org chart that is alive.
    Nobody is drawn and no position is named (law 9, D-007); the chart is the
    whole boss. No text, no titles, no lettering on the bars.

    The connectors come first, because they are what make it a diagram and
    not a pile: the first batch asked for a ziggurat of stacked boxes and got
    a chest of drawers. Every link is the org chart's own: a rule down from
    the parent's centre, a horizontal bus across its children's centres, and
    a rule down into each child; a lone child hangs straight below its
    parent. One width, 4, everywhere, in teal, drawn first and run 2 into
    the boxes they join, underneath them. CONFORM rings each one in ink, so
    at arena size a link reads as a bold dark rule with a teal core.

    Silhouette (law 11, the act's sixth reservation): the tree of boxes. Four
    rows, 1, 2, 3, 4, widening downward; ten boxes, every one separate, none
    touching and none stacked. Neighbours in a row stand at least 40 apart;
    each bus runs 32 clear of the boxes above and below it, so 16 of carpet
    shows between the two outlines. The tree is lopsided the way charts are:
    the left box of the second row has two reports, the right one has one,
    and that one has two.

    Ruled geometry (law 4's one exception, G-013): the only thing in the life
    drawn with a ruler. Every edge is axis-aligned and on the pixel grid. The
    viewBox is the 384px sprite: the drawing fills 8 to 376 on both axes,
    exactly CONFORM's inner 368 with its 8px outline in the margin, so the
    rasteriser fits it at 288 dpi (4x of 72) on its first render and every
    edge lands on a whole pixel: each link is 4 wide in the sprite, every
    one. CONFORM's outline is a disc dilation, so along the straight edges it
    is a straight band of 8 and it rounds only the outside of each corner.
    Nothing here is rounded by hand.

    The top box: 144 by 56, larger than any other, and empty for the whole
    fight. No face, no bar and no fill: it is drawn as its outline alone, a
    teal frame 8 wide with the carpet showing through the middle, the one
    position in the chart with nobody in it. A solid teal top box was
    measured at 0.4449 of the sprite lost in office-deep (CHECK allows 0.4):
    a blank teal slab is the one thing on this carpet nobody can see.

    Boxes, rows two to four: 62 by 36, teal. In each, a face (two ink dots,
    r 5, and one flat mouth, 18 by 4) and one bone label bar, 44 by 8, under
    it. The bars are centred and level in every box, as a printed chart sets
    its labels; only the faces move, each sitting off-centre toward what it
    is looking at. The two in the second row look at each other. The third
    row looks up at the box it reports to, except the one on the right,
    which looks up and left, past its own, at the empty box. In the fourth
    row the two on the left look at each other and the two on the right look
    up at theirs. None looks out of the chart. Flat, no depth and no drawer:
    nothing inside a box runs its full width.

    Rows, for the renderer, which greys them from the bottom as the chart
    takes damage (G-004: damaged boxes go grey and stay in the chart). In the
    384 frame the teal of row 1 is y 8-64, row 2 132-168, row 3 236-272 and
    row 4 340-376; each gains 8 of ink above and below. The middle two rows
    centre on y 202 (0.526). bossBody { cy: 0.526, r: 0.30 } covers both of
    them and the links between them, and stops short of the top and bottom
    rows (r 0.21 just spans them; 0.33 touches rows 1 and 4).

    Flat on purpose: no halftone, no gleam, no shadow tone. TEXTURE adds the
    grain (D-018). CONFORM adds the outline; none here.
    Colours: threat-boss #2F7370, ink #2A2521, bone #D2C6AC.
  -->
  <!-- the connectors: ruled, one width, drawn first and run under the boxes they join -->
  <g>
    <!-- the empty top box down to the second row -->
    <rect x="190" y="62" width="4" height="36" fill="#2F7370"/>
    <rect x="88" y="96" width="208" height="4" fill="#2F7370"/>
    <rect x="88" y="98" width="4" height="36" fill="#2F7370"/>
    <rect x="292" y="98" width="4" height="36" fill="#2F7370"/>
    <!-- the second row down to the third -->
    <rect x="88" y="166" width="4" height="36" fill="#2F7370"/>
    <rect x="37" y="200" width="106" height="4" fill="#2F7370"/>
    <rect x="37" y="202" width="4" height="36" fill="#2F7370"/>
    <rect x="139" y="202" width="4" height="36" fill="#2F7370"/>
    <rect x="292" y="166" width="4" height="72" fill="#2F7370"/>
    <!-- the third row down to the fourth -->
    <rect x="37" y="270" width="4" height="72" fill="#2F7370"/>
    <rect x="139" y="270" width="4" height="72" fill="#2F7370"/>
    <rect x="292" y="270" width="4" height="36" fill="#2F7370"/>
    <rect x="241" y="304" width="106" height="4" fill="#2F7370"/>
    <rect x="241" y="306" width="4" height="36" fill="#2F7370"/>
    <rect x="343" y="306" width="4" height="36" fill="#2F7370"/>
  </g>
  <!-- the top box: larger, and empty for the whole fight. A frame and nothing in it -->
  <path d="M120,8 H264 V64 H120 Z M128,16 V56 H256 V16 Z" fill="#2F7370" fill-rule="evenodd"/>
  <!-- the second row -->
  <g><!-- looks right, at the other box in its row -->
    <rect x="59" y="132" width="62" height="36" fill="#2F7370"/>
    <circle cx="92" cy="143" r="5" fill="#2A2521"/>
    <circle cx="110" cy="143" r="5" fill="#2A2521"/>
    <rect x="89" y="150" width="18" height="4" fill="#2A2521"/>
    <rect x="68" y="157" width="44" height="8" fill="#D2C6AC"/>
  </g>
  <g><!-- looks left, at the other box in its row -->
    <rect x="263" y="132" width="62" height="36" fill="#2F7370"/>
    <circle cx="274" cy="143" r="5" fill="#2A2521"/>
    <circle cx="292" cy="143" r="5" fill="#2A2521"/>
    <rect x="277" y="150" width="18" height="4" fill="#2A2521"/>
    <rect x="272" y="157" width="44" height="8" fill="#D2C6AC"/>
  </g>
  <!-- the third row -->
  <g><!-- looks up and right, at the box it reports to -->
    <rect x="8" y="236" width="62" height="36" fill="#2F7370"/>
    <circle cx="37" cy="243" r="5" fill="#2A2521"/>
    <circle cx="55" cy="243" r="5" fill="#2A2521"/>
    <rect x="35" y="250" width="18" height="4" fill="#2A2521"/>
    <rect x="17" y="261" width="44" height="8" fill="#D2C6AC"/>
  </g>
  <g><!-- looks up and left, at the box it reports to -->
    <rect x="110" y="236" width="62" height="36" fill="#2F7370"/>
    <circle cx="125" cy="243" r="5" fill="#2A2521"/>
    <circle cx="143" cy="243" r="5" fill="#2A2521"/>
    <rect x="127" y="250" width="18" height="4" fill="#2A2521"/>
    <rect x="119" y="261" width="44" height="8" fill="#D2C6AC"/>
  </g>
  <g><!-- looks up and left, past the box it reports to, at the empty one -->
    <rect x="263" y="236" width="62" height="36" fill="#2F7370"/>
    <circle cx="278" cy="243" r="5" fill="#2A2521"/>
    <circle cx="296" cy="243" r="5" fill="#2A2521"/>
    <rect x="280" y="250" width="18" height="4" fill="#2A2521"/>
    <rect x="272" y="261" width="44" height="8" fill="#D2C6AC"/>
  </g>
  <!-- the fourth row -->
  <g><!-- looks right, at its neighbour -->
    <rect x="8" y="340" width="62" height="36" fill="#6E6353"/>
    <circle cx="41" cy="351" r="5" fill="#D2C6AC"/>
    <circle cx="59" cy="351" r="5" fill="#D2C6AC"/>
    <rect x="38" y="358" width="18" height="4" fill="#D2C6AC"/>
    <rect x="17" y="365" width="44" height="8" fill="#D2C6AC"/>
  </g>
  <g><!-- looks left, at its neighbour -->
    <rect x="110" y="340" width="62" height="36" fill="#6E6353"/>
    <circle cx="121" cy="351" r="5" fill="#D2C6AC"/>
    <circle cx="139" cy="351" r="5" fill="#D2C6AC"/>
    <rect x="124" y="358" width="18" height="4" fill="#D2C6AC"/>
    <rect x="119" y="365" width="44" height="8" fill="#D2C6AC"/>
  </g>
  <g><!-- looks up and right, at the box it reports to -->
    <rect x="212" y="340" width="62" height="36" fill="#6E6353"/>
    <circle cx="241" cy="347" r="5" fill="#D2C6AC"/>
    <circle cx="259" cy="347" r="5" fill="#D2C6AC"/>
    <rect x="239" y="354" width="18" height="4" fill="#D2C6AC"/>
    <rect x="221" y="365" width="44" height="8" fill="#D2C6AC"/>
  </g>
  <g><!-- looks up and left, at the box it reports to -->
    <rect x="314" y="340" width="62" height="36" fill="#6E6353"/>
    <circle cx="329" cy="347" r="5" fill="#D2C6AC"/>
    <circle cx="347" cy="347" r="5" fill="#D2C6AC"/>
    <rect x="331" y="354" width="18" height="4" fill="#D2C6AC"/>
    <rect x="323" y="365" width="44" height="8" fill="#D2C6AC"/>
  </g>
</svg>
