<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player at twenty-two</title>
  <desc>The same face and single cowlick as in every act: the same small round-headed figure as at eighteen, no taller, in a plain shirt with a short flat tie down the front and a belt, one hand at the hip and the other holding a small mug.</desc>
  <!--
    The player at twenty-two (G-003, OFFICE-ROSTER §5). The same drawing as
    player-college with the costume changed: the head, eyes, mouth, cowlick,
    legs and the body's outline are that file's geometry unchanged, and the
    figure spans the same height, so the head is drawn at the same size and
    height; the mug's handle widens the frame on the left, never its height.
    Not taller: taller is Growth Spurt's. The face does not change.
    What went: the lanyard and its card, the paper cup, the hood, the
    drawstrings and the front pocket. What came: the hoodie's outline is now a
    shirt in paper, tucked in, its hem seam a belt; a collar of two ink-edged
    leaves under the chin; a short flat tie in shadow that stops well above the
    belt; the free arm's inside edge running down to the hip, hand in the
    pocket; and in the other hand, where the cup was, a small straight-sided
    mug, paper, an ink line under its rim and its handle a shadow loop with an
    ink hollow, turned outward so it reads as a mug and not a cup. On a paper
    shirt the college arm's line and ring read as a musical note, so that arm
    is one ink contour from the armpit on round the hand. Head, shirt, collar,
    mug and hand stay paper, which is the player's and nothing else's
    (law 10). Nothing is written on anything. The tie's tip and the collar's
    are interior detail on the player, not a silhouette: the row of stars
    still holds the only points on anything that hurts (law 11).
    CONFORM adds the outline; there is none here.
    Colours are palette hex values: paper #EFE7D6, shadow #6E6353, ink #2A2521.
  -->
  <!-- The cowlick: one hair, always. -->
  <path d="M54 12 C52 4 58 0 62 3 C58 4 57 8 58 12 Z" fill="#2A2521"/>
  <!-- legs, as at five -->
  <path d="M40 84 L47 84 L47 98 L40 98 Z M53 84 L60 84 L60 98 L53 98 Z" fill="#EFE7D6"/>
  <!-- the shirt: the hoodie's outline at eighteen, now paper, tucked in -->
  <path d="M31 65 C31 60 36 58 42 58 L58 58 C64 58 69 60 69 65 C71 70 72.5 74 72 78 C71.5 81 69 82 67 82 L67.5 86 C67.5 87.5 66.5 88 65 88 L35 88 C33.5 88 32.5 87.5 32.5 86 L33 82 C31 82 28.5 81 28 78 C27.5 74 29 70 31 65 Z" fill="#EFE7D6"/>
  <!-- the belt: where the hem seam was -->
  <path d="M33.5 81.2 L66.5 81.2 L66.5 83.4 L33.5 83.4 Z" fill="#2A2521"/>
  <!-- the right arm, inside edge, down to the hip: the hand is in the pocket -->
  <path d="M65.5 64 C65.2 70 64.7 75.5 63.8 81.2 L65.6 81.2 C66.4 75.5 66.9 70 67.4 64.4 Z" fill="#2A2521"/>
  <!-- the tie: a knot, an ink line under it, then a short flat blade that
       stops well above the belt -->
  <path d="M47.2 59 L52.8 59 L51.9 65.6 L48.1 65.6 Z" fill="#6E6353"/>
  <path d="M48 65.6 L52 65.6 L52.1 66.6 L47.9 66.6 Z" fill="#2A2521"/>
  <path d="M48 66.6 L52 66.6 L54.2 76.6 L50 79.6 L45.8 76.6 Z" fill="#6E6353"/>
  <!-- the collar: two leaves either side of the knot, edged in ink -->
  <path d="M38.8 58.4 L47.4 59.6 L47.6 63.6 L44.6 67.6 Z" fill="#EFE7D6" stroke="#2A2521" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M61.2 58.4 L52.6 59.6 L52.4 63.6 L55.4 67.6 Z" fill="#EFE7D6" stroke="#2A2521" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- the head: player-school's, unchanged -->
  <circle cx="50" cy="36" r="26" fill="#EFE7D6"/>
  <ellipse cx="57" cy="34" rx="3.4" ry="6" fill="#2A2521"/>
  <ellipse cx="68" cy="34" rx="3.4" ry="6" fill="#2A2521"/>
  <rect x="58" y="46" width="9" height="2.8" rx="1.3" fill="#2A2521"/>
  <!-- the mug, where the cup was: straight sides, an ink line under the rim,
       and the handle a shadow lug turned outward with an ink hollow -->
  <ellipse cx="18" cy="70.2" rx="4.3" ry="4.4" fill="#6E6353"/>
  <ellipse cx="17.5" cy="70.2" rx="1.9" ry="2.3" fill="#2A2521"/>
  <path d="M18 64.8 L29 64.8 L29 73.8 C29 74.8 28.4 75.2 27.4 75.2 L19.6 75.2 C18.6 75.2 18 74.8 18 73.8 Z" fill="#EFE7D6"/>
  <path d="M18 66.4 L29 66.4 L29 67.4 L18 67.4 Z" fill="#2A2521"/>
  <!-- the left arm, where it was at eighteen: one ink contour down its inside
       edge and on round the hand, so on the paper shirt the arm and the hand
       read as one limb rather than a line and a ring -->
  <ellipse cx="29.6" cy="72" rx="3.8" ry="3.4" fill="#EFE7D6"/>
  <path d="M33.6 63.8 C34.5 67 34.2 69.6 32.95 72 A3.35 2.95 0 1 1 29.6 69.05" fill="none" stroke="#2A2521" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
