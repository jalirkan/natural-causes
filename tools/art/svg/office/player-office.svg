<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player at twenty-two</title>
  <desc>The same chubby child as at school age, no taller, the same face, blush and one cowlick, in a plain shirt with a round collar, a short tie and a belt, one arm down at its side and the other hand holding up a small mug.</desc>
  <!--
    The player at twenty-two (G-003, G-053; OFFICE-ROSTER §5). The joke is a
    kid in a tie. The same drawing as player-school with the costume changed:
    the head group is that file's markup verbatim, the legs, the body's
    outline and the free arm are its geometry, and the figure spans the same
    height, so the head is drawn at the same size and height. Not taller:
    taller is Growth Spurt's. The face does not change.
    What went: the hoodie, its pocket, the lanyard and the cup. What came: the
    body is a shirt, still paper; a round collar of two leaves edged in ink; a
    short tie in shadow, its knot edged in ink, its blade stopping well above
    the belt; an ink belt; and in the left hand, raised where the cup was, a
    small mug in shadow, its handle a round loop turned outward with an ink
    hollow, the coffee an ink line under its rim, and one paper glint, upper
    left. The mug widens the frame on the left and never its height. Head, shirt, collar, legs and hands stay paper, which is the
    player's and nothing else's (law 10). Nothing is written on anything.
    CONFORM adds the outline; there is none here, and no strokes.
    Colours are palette hex values: paper #EFE7D6, shadow #6E6353,
    ink #2A2521, blush #EBA39C.
  -->
  <defs>
    <!-- the body the head sits on: the chin line is drawn only over it -->
    <clipPath id="body">
      <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z"/>
    </clipPath>
  </defs>
  <!-- the legs, as at school -->
  <path d="M38.6 85 L48 85 L48 93.6 C48 96.2 46 98 43.3 98 C40.6 98 38.6 96.2 38.6 93.6 Z M52 85 L61.4 85 L61.4 93.6 C61.4 96.2 59.4 98 56.7 98 C54 98 52 96.2 52 93.6 Z" fill="#EFE7D6"/>
  <!-- the right arm, down at the side as at school, and its mitten hand -->
  <rect x="-3.9" y="0" width="7.8" height="14" rx="3.9" transform="translate(65.5 63.5) rotate(-42)" fill="#EFE7D6"/>
  <ellipse cx="75.6" cy="75.2" rx="4.8" ry="5" fill="#EFE7D6"/>
  <!-- the left arm, raised to the mug where the cup was at eighteen -->
  <g fill="#EFE7D6">
    <rect x="-4" y="-4" width="8" height="18.74" rx="4" transform="translate(35.5 64) rotate(27.8)"/>
    <rect x="-3.8" y="-3.8" width="7.6" height="16.68" rx="3.8" transform="translate(30.5 73.5) rotate(118.3)"/>
  </g>
  <!-- the shirt: the body's outline, paper -->
  <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z" fill="#EFE7D6"/>
  <!-- the belt -->
  <rect x="30" y="83.4" width="40" height="2" fill="#2A2521" clip-path="url(#body)"/>
  <!-- the tie's blade: short, a rounded tip well above the belt -->
  <path d="M48.1 65.5 L51.9 65.5 L54 76.5 C54.2 77.6 53.8 78.3 53 78.9 L51 80.3 C50.4 80.7 49.6 80.7 49 80.3 L47 78.9 C46.2 78.3 45.8 77.6 46 76.5 Z" fill="#6E6353"/>
  <!-- the collar: two round leaves, edged in ink -->
  <g fill="#2A2521">
    <ellipse cx="0" cy="0" rx="4.6" ry="6.4" transform="translate(45 63.2) rotate(48)"/>
    <ellipse cx="0" cy="0" rx="4.6" ry="6.4" transform="translate(55 63.2) rotate(-48)"/>
  </g>
  <g fill="#EFE7D6">
    <ellipse cx="0" cy="0" rx="3.2" ry="5" transform="translate(45 63.2) rotate(48)"/>
    <ellipse cx="0" cy="0" rx="3.2" ry="5" transform="translate(55 63.2) rotate(-48)"/>
  </g>
  <!-- the tie's knot, edged in ink -->
  <ellipse cx="50" cy="64.4" rx="3.5" ry="3.1" fill="#2A2521"/>
  <ellipse cx="50" cy="64.4" rx="2.3" ry="1.9" fill="#6E6353"/>
  <!-- the head: the same markup in all seven player drawings -->
  <g id="head">
    <ellipse cx="50" cy="36.9" rx="30" ry="28" fill="#2A2521" clip-path="url(#body)"/>
    <path d="M39.8 10 C39.2 6.4 41 3 44.6 1.4 C46.4 0.6 48.4 0.3 50 0.6 C50.8 0.8 50.9 1.5 50.3 1.9 C48 3.1 46.6 4.6 46 6.2 C45.6 7.4 45.6 8.6 45.9 10 Z" fill="#2A2521"/>
    <ellipse cx="50" cy="35" rx="30" ry="28" fill="#EFE7D6"/>
    <ellipse cx="42.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <ellipse cx="63.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <circle cx="40.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <circle cx="61.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <ellipse cx="36.3" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <ellipse cx="69.7" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <path d="M50.2 48.2 C50.6 47.6 51.4 47.7 51.7 48.3 C52.6 50 55 50 55.9 48.3 C56.2 47.7 57 47.6 57.4 48.2 C57.7 48.6 57.6 49 57.3 49.5 C55.9 52.2 51.7 52.2 50.3 49.5 C50 49 49.9 48.6 50.2 48.2 Z" fill="#2A2521"/>
  </g>
  <!-- the mug, shadow, where the cup was: the handle a round loop turned
       outward with an ink hollow, the body, and the coffee in ink under
       the rim -->
  <ellipse cx="11.4" cy="63" rx="4.4" ry="4.9" fill="#6E6353"/>
  <ellipse cx="11.4" cy="63" rx="1.8" ry="2.4" fill="#2A2521"/>
  <rect x="13.2" y="56.6" width="11" height="12.4" rx="2.3" fill="#6E6353"/>
  <ellipse cx="18.7" cy="58.3" rx="3.9" ry="0.95" fill="#2A2521"/>
  <!-- one glint on the mug, upper left -->
  <circle cx="15.5" cy="61" r="0.6" fill="#EFE7D6"/>
  <!-- the left hand under the mug -->
  <ellipse cx="22.5" cy="69.2" rx="4.4" ry="4.6" fill="#EFE7D6"/>
</svg>
