<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 100">
  <title>Group project</title>
  <desc>Four round lumps fused into one uneven purple mass, one face on each: three asleep with closed eyes and flat mouths, one awake with two open dots and a flat mouth. Nothing else says which lump matters.</desc>
  <!--
    Group project (COLLEGE-ROSTER §3.4), the act's roadblock and its elite.
    Reserved silhouette: the cluster, the only silhouette in the act with
    more than one face and the only fused mass. The clique's verb (a fused
    mass with faces) in this act's threat colour, with no body under it:
    the lumps are the role, so there are no heads, arms, clothes or hair.
    Four lumps, uneven in size, pressed into one another: two at the back,
    two in front. Every lump is round and slightly squashed under its own
    weight, so nothing reads as a square (the deadline's) or a pile (the
    reading's).
    One purple on all four lumps. One shadow tone, #6E6353, the clique's,
    and nothing else: the whole mass is laid down in it and then again in
    purple six units higher, clipped to itself, which leaves one band under
    every edge that faces down. Four creases in the same tone start at the
    four notches in the outline and stop short of the middle, where the
    lumps are fused.
    Faces: three asleep (closed arcs, flat mouths), one awake (open dots,
    flat mouth). Only that face differs. In the sim one of four quadrants
    takes the damage, rolled at spawn, and this is one frame: the awake
    face is a decoy as often as not.
    CONFORM adds the outline; there is none here.
    Colours are palette hex values: threat-elite #7C5C8A, shadow #6E6353,
    ink #2A2521.
  -->
  <defs>
    <clipPath id="mass">
      <ellipse cx="79" cy="40" rx="21" ry="19"/>
      <ellipse cx="46" cy="35" rx="25" ry="22.5"/>
      <ellipse cx="31" cy="64" rx="22.5" ry="20"/>
      <ellipse cx="66" cy="68" rx="25" ry="22"/>
    </clipPath>
  </defs>
  <!-- the mass in the shadow tone: back right, back left, front left, front right -->
  <g fill="#6E6353">
    <ellipse cx="79" cy="40" rx="21" ry="19"/>
    <ellipse cx="46" cy="35" rx="25" ry="22.5"/>
    <ellipse cx="31" cy="64" rx="22.5" ry="20"/>
    <ellipse cx="66" cy="68" rx="25" ry="22"/>
  </g>
  <!-- the same mass in purple, six units up, clipped to the mass -->
  <g fill="#7C5C8A" clip-path="url(#mass)">
    <ellipse cx="79" cy="34" rx="21" ry="19"/>
    <ellipse cx="46" cy="29" rx="25" ry="22.5"/>
    <ellipse cx="31" cy="58" rx="22.5" ry="20"/>
    <ellipse cx="66" cy="62" rx="25" ry="22"/>
  </g>
  <!-- four creases, each from a notch in the outline inward, none reaching the middle -->
  <g fill="none" stroke="#6E6353" stroke-width="3" stroke-linecap="round" clip-path="url(#mass)">
    <path d="M69.09,23.41 A26.4,23.9 0 0 1 72.14,38.33"/>
    <path d="M23.22,43.77 A23.9,21.4 0 0 1 41.1,44.61"/>
    <path d="M89.09,56.66 A26.4,23.4 0 0 0 75.03,46.01"/>
    <path d="M43.61,80.4 A26.4,23.4 0 0 1 39.86,64.74"/>
  </g>
  <!-- three asleep: closed eye arcs -->
  <g fill="none" stroke="#2A2521" stroke-width="2.8" stroke-linecap="round">
    <path d="M34.3,27 Q38.5,32.5 42.7,27"/>
    <path d="M47.3,27 Q51.5,32.5 55.7,27"/>
    <path d="M73.3,33 Q77.5,38.5 81.7,33"/>
    <path d="M86.3,33 Q90.5,38.5 94.7,33"/>
    <path d="M56.3,62 Q60.5,67.5 64.7,62"/>
    <path d="M69.3,62 Q73.5,67.5 77.7,62"/>
  </g>
  <g fill="#2A2521">
    <!-- one awake, front left: open dots -->
    <circle cx="20.5" cy="62" r="3.4"/>
    <circle cx="33.5" cy="62" r="3.4"/>
    <!-- four flat mouths, one each -->
    <rect x="39.5" y="36" width="11" height="3.2" rx="1.6"/>
    <rect x="78.5" y="42" width="11" height="3.2" rx="1.6"/>
    <rect x="21.5" y="70" width="11" height="3.2" rx="1.6"/>
    <rect x="61.5" y="71" width="11" height="3.2" rx="1.6"/>
  </g>
</svg>
