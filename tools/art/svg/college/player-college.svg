<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player at eighteen</title>
  <desc>The same face and single cowlick as in every act: the same small round-headed figure as at thirteen, no taller, in the same hoodie, with a thin lanyard around the neck ending in a small blank card, and a small paper cup held in one hand.</desc>
  <!--
    The player at eighteen (G-003, COLLEGE-ROSTER §5). The same drawing as
    player-adolescence with two things added: the head, eyes, mouth, cowlick,
    legs and hoodie are that file's geometry unchanged, and the figure spans
    the same height, so the head is drawn at the same size and height. Not
    taller: taller is Growth Spurt's. The face does not change.
    What is added: a lanyard, two ink cords from under the chin across the
    rolled hood to a small blank card, edged in ink so the drawstrings tucked
    behind it do not run into it; nothing is written on the card. And one hand
    out of the pocket holding a small paper cup (a rolled lip over an ink
    line), which widens the frame on the left and never its height. The other
    hand stays in the pocket. Head, drawstrings, card, cup and hand stay paper,
    which is the player's and nothing else's (law 10).
    CONFORM adds the outline; there is none here.
    Colours are palette hex values: paper #EFE7D6, shadow #6E6353, ink #2A2521.
  -->
  <!-- The cowlick: one hair, always. -->
  <path d="M54 12 C52 4 58 0 62 3 C58 4 57 8 58 12 Z" fill="#2A2521"/>
  <!-- legs, as at five -->
  <path d="M40 84 L47 84 L47 98 L40 98 Z M53 84 L60 84 L60 98 L53 98 Z" fill="#EFE7D6"/>
  <!-- the hoodie, as at thirteen -->
  <path d="M31 65 C31 60 36 58 42 58 L58 58 C64 58 69 60 69 65 C71 70 72.5 74 72 78 C71.5 81 69 82 67 82 L67.5 86 C67.5 87.5 66.5 88 65 88 L35 88 C33.5 88 32.5 87.5 32.5 86 L33 82 C31 82 28.5 81 28 78 C27.5 74 29 70 31 65 Z" fill="#6E6353"/>
  <!-- the hem band's seam -->
  <path d="M33.5 81.2 L66.5 81.2 L66.5 83.2 L33.5 83.2 Z" fill="#2A2521"/>
  <!-- the right arm, inside edge, still running into the pocket -->
  <path d="M65.5 64 C64.5 69 63.5 73 60.5 77 L62.2 78 C65.5 74 66.8 69 67.4 64.4 Z" fill="#2A2521"/>
  <!-- the front pocket: its top edge and the two slanted openings -->
  <path d="M38 81.2 L41 71 L59 71 L62 81.2 L59.6 81.2 L57.2 73.4 L42.8 73.4 L40.4 81.2 Z" fill="#2A2521"/>
  <!-- the hood, rolled down behind the neck: an ink seam, then the hood -->
  <ellipse cx="50" cy="60.5" rx="20.5" ry="8" fill="#2A2521"/>
  <ellipse cx="50" cy="59.5" rx="19" ry="6.8" fill="#6E6353"/>
  <!-- the drawstrings -->
  <path d="M45 65 L47 65 L46.6 72 L44.8 72 Z M53 65 L55 65 L55.2 72 L53.4 72 Z" fill="#EFE7D6"/>
  <!-- the lanyard: two cords from under the chin, over the hood -->
  <path d="M39.3 58.8 L40.7 58.2 L46.1 68.9 L44.7 69.5 Z M60.7 58.8 L59.3 58.2 L53.9 68.9 L55.3 69.5 Z" fill="#2A2521"/>
  <!-- the card: blank, edged in ink -->
  <rect x="43.6" y="68.2" width="12.8" height="10.6" rx="1.4" fill="#2A2521"/>
  <rect x="44.5" y="69.1" width="11" height="8.8" rx="0.9" fill="#EFE7D6"/>
  <!-- the head: player-school's, unchanged -->
  <circle cx="50" cy="36" r="26" fill="#EFE7D6"/>
  <ellipse cx="57" cy="34" rx="3.4" ry="6" fill="#2A2521"/>
  <ellipse cx="68" cy="34" rx="3.4" ry="6" fill="#2A2521"/>
  <rect x="58" y="46" width="9" height="2.8" rx="1.3" fill="#2A2521"/>
  <!-- the cup: tapered, a rolled lip over an ink line -->
  <path d="M19.3 65.5 L29.7 65.5 L27.7 77.5 L21.3 77.5 Z" fill="#EFE7D6"/>
  <rect x="18.4" y="63.4" width="12.2" height="2.6" rx="1.2" fill="#EFE7D6"/>
  <path d="M19.1 66 L29.9 66 L29.75 67 L19.25 67 Z" fill="#2A2521"/>
  <!-- the left arm, out of the pocket: its inside edge, then the hand on the cup -->
  <path d="M34.5 64 C35 66.5 35 68.5 34 70.5 L32.3 70.2 C33 68.3 33 66.4 32.6 64.4 Z" fill="#2A2521"/>
  <ellipse cx="29.6" cy="72" rx="3.8" ry="3.4" fill="#2A2521"/>
  <ellipse cx="29.6" cy="72" rx="2.9" ry="2.5" fill="#EFE7D6"/>
</svg>
