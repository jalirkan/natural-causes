<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Player at eighteen</title>
  <desc>The same chubby child as at thirteen, no taller, the same face, blush and one cowlick, in the same round hoodie with a lanyard around the neck ending in a small blank card, one hand still in the pocket and the other holding up a small takeaway cup.</desc>
  <!--
    The player at eighteen (G-003, G-053; COLLEGE-ROSTER §5). The same drawing
    as player-adolescence with two things added: the head group is
    player-school's markup verbatim, the legs, the hoodie, its hood, hem and
    pocket and the right arm are the thirteen-year-old's geometry, and the
    figure spans the same height, so the head is drawn at the same size and
    height. Not taller: taller is Growth Spurt's. The face does not change.
    What is added: a lanyard, two ink cords from under the chin to a small
    blank card, paper edged in ink, where the drawstrings hung; nothing is
    written on the card. And the left hand out of the pocket, the elbow where
    it was and the forearm raised, holding a small takeaway cup: bone, with a
    shadow lid and a shadow sleeve, and one paper glint, upper left. The cup
    widens the frame on the left and never its height. Head, legs, card and
    hand stay paper, which is the player's and nothing else's (law 10).
    CONFORM adds the outline; there is none here, and no strokes.
    Colours are palette hex values: paper #EFE7D6, bone #D2C6AC,
    shadow #6E6353, ink #2A2521, blush #EBA39C.
  -->
  <defs>
    <!-- the body the head sits on: the chin line is drawn only over it -->
    <clipPath id="body">
      <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z"/>
    </clipPath>
  </defs>
  <!-- the legs, as at school -->
  <path d="M38.6 85 L48 85 L48 93.6 C48 96.2 46 98 43.3 98 C40.6 98 38.6 96.2 38.6 93.6 Z M52 85 L61.4 85 L61.4 93.6 C61.4 96.2 59.4 98 56.7 98 C54 98 52 96.2 52 93.6 Z" fill="#EFE7D6"/>
  <!-- the hoodie, as at thirteen -->
  <path d="M40 57 C35.5 57 33.2 60 32.8 64.5 C32 71 31.8 78 32.6 83 C33.2 87 35.8 89 40 89 L60 89 C64.2 89 66.8 87 67.4 83 C68.2 78 68 71 67.2 64.5 C66.8 60 64.5 57 60 57 Z" fill="#6E6353"/>
  <!-- the hem band's seam -->
  <rect x="30" y="83.4" width="40" height="1.9" fill="#2A2521" clip-path="url(#body)"/>
  <!-- the sleeves' edges, in ink, where they lie on the hoodie -->
  <g fill="#2A2521" clip-path="url(#body)">
    <rect x="-5.8" y="-5.8" width="11.6" height="22.34" rx="5.8" transform="translate(35.5 64) rotate(27.8)"/>
    <rect x="-5.6" y="-5.6" width="11.2" height="20.28" rx="5.6" transform="translate(30.5 73.5) rotate(118.3)"/>
    <rect x="-5.8" y="-5.8" width="11.6" height="22.34" rx="5.8" transform="translate(64.5 64) rotate(-27.8)"/>
    <rect x="-5.6" y="-5.6" width="11.2" height="23.05" rx="5.6" transform="translate(69.5 73.5) rotate(62.4)"/>
  </g>
  <!-- the sleeves: the right forearm in to the pocket, the left raised to the cup -->
  <g fill="#6E6353">
    <rect x="-4" y="-4" width="8" height="18.74" rx="4" transform="translate(35.5 64) rotate(27.8)"/>
    <rect x="-3.8" y="-3.8" width="7.6" height="16.68" rx="3.8" transform="translate(30.5 73.5) rotate(118.3)"/>
    <rect x="-4" y="-4" width="8" height="18.74" rx="4" transform="translate(64.5 64) rotate(-27.8)"/>
    <rect x="-3.8" y="-3.8" width="7.6" height="19.45" rx="3.8" transform="translate(69.5 73.5) rotate(62.4)"/>
  </g>
  <!-- the front pocket, as at thirteen -->
  <path d="M39.4 71.4 L60.6 71.4 C63 71.4 64.8 72.8 65.2 75 L66.6 85.3 L33.4 85.3 L34.8 75 C35.2 72.8 37 71.4 39.4 71.4 Z" fill="#2A2521" clip-path="url(#body)"/>
  <path d="M39.6 73.2 L60.4 73.2 C62 73.2 63.2 74.2 63.5 75.8 L64.7 83.4 L35.3 83.4 L36.5 75.8 C36.8 74.2 38 73.2 39.6 73.2 Z" fill="#6E6353"/>
  <!-- the hood, rolled down behind the neck, as at thirteen -->
  <ellipse cx="50" cy="61.9" rx="21.2" ry="6.4" fill="#2A2521" clip-path="url(#body)"/>
  <ellipse cx="50" cy="60" rx="21" ry="6" fill="#6E6353"/>
  <!-- one glint on the hoodie, upper left, as at thirteen -->
  <ellipse cx="33.6" cy="66.4" rx="1.3" ry="1.5" fill="#EFE7D6"/>
  <!-- the lanyard: two cords from under the chin to the card -->
  <path d="M40.6 59.6 L42 59 L47 67.4 L45.6 68 Z M59.4 59.6 L58 59 L53 67.4 L54.4 68 Z" fill="#2A2521"/>
  <!-- the card: blank, paper edged in ink -->
  <rect x="43.6" y="66.2" width="12.8" height="10.4" rx="2" fill="#2A2521"/>
  <rect x="45" y="67.6" width="10" height="7.6" rx="1.3" fill="#EFE7D6"/>
  <!-- the head: the same markup in all seven player drawings -->
  <g id="head">
    <ellipse cx="50" cy="36.9" rx="30" ry="28" fill="#2A2521" clip-path="url(#body)"/>
    <path d="M39.8 10 C39.2 6.4 41 3 44.6 1.4 C46.4 0.6 48.4 0.3 50 0.6 C50.8 0.8 50.9 1.5 50.3 1.9 C48 3.1 46.6 4.6 46 6.2 C45.6 7.4 45.6 8.6 45.9 10 Z" fill="#2A2521"/>
    <ellipse cx="50" cy="35" rx="30" ry="28" fill="#EFE7D6"/>
    <ellipse cx="42.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <ellipse cx="63.5" cy="38" rx="5.2" ry="6.8" fill="#2A2521"/>
    <circle cx="40.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <circle cx="61.6" cy="35.2" r="1.8" fill="#EFE7D6"/>
    <ellipse cx="36.3" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <ellipse cx="69.7" cy="48.2" rx="4.4" ry="2.6" fill="#EBA39C"/>
    <path d="M50.2 48.2 C50.6 47.6 51.4 47.7 51.7 48.3 C52.6 50 55 50 55.9 48.3 C56.2 47.7 57 47.6 57.4 48.2 C57.7 48.6 57.6 49 57.3 49.5 C55.9 52.2 51.7 52.2 50.3 49.5 C50 49 49.9 48.6 50.2 48.2 Z" fill="#2A2521"/>
  </g>
  <!-- the cup: bone, tapered, a shadow sleeve round its middle and a shadow lid -->
  <path d="M13.8 57.5 L24.2 57.5 L22.9 70 C22.8 70.8 22.3 71.2 21.5 71.2 L16.5 71.2 C15.7 71.2 15.2 70.8 15.1 70 Z" fill="#D2C6AC"/>
  <path d="M14.3 61.6 L23.7 61.6 L23.3 65.4 L14.7 65.4 Z" fill="#6E6353"/>
  <rect x="12.6" y="55.2" width="12.8" height="3.4" rx="1.7" fill="#6E6353"/>
  <!-- one glint on the cup, upper left -->
  <circle cx="15.6" cy="59.6" r="0.6" fill="#EFE7D6"/>
  <!-- the left hand round the cup -->
  <ellipse cx="22.5" cy="69.2" rx="4.4" ry="4.6" fill="#EFE7D6"/>
</svg>
