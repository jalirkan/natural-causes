<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    Rival sperm (CONCEPTION-ROSTER §2, §3). The comet: a smooth dome and one
    short, fat tail with a single flick — no other enemy in the act has a tail.
    Faces right, travelling; the scene flips it toward the player, so the face
    is always at the front, looking where it is going and not at you (law 8).
    Flat bone, not paper: paper and the cowlick are the player's (G-003).
    Face: two heavy-lidded dots and a flat line. It is the commute.
    CONFORM adds the outline; there is none here. crispEdges stops
    anti-aliased ink/bone edges quantising to stray tones.
    Colours are palette hex values: bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges">
  <!-- tail: wide at the head, drooping, flicking up to a blunt point -->
  <path d="M52,36 C40,38 31,45 22,46 C15,47 10,43 5,38 Q2,38 3,42 C8,51 15,58 25,58 C34,58 42,61 52,64 Z" fill="#D2C6AC"/>
  <!-- head: the dome -->
  <ellipse cx="69" cy="50" rx="28" ry="25" fill="#D2C6AC"/>
  <!-- eyes: flat-topped dots, lids halfway down, set at the front -->
  <path d="M70.76,44.5 A4.5,4.5 0 1 0 79.24,44.5 Z" fill="#2A2521"/>
  <path d="M83.26,44.5 A4.5,4.5 0 1 0 91.74,44.5 Z" fill="#2A2521"/>
  <!-- mouth: a flat line -->
  <rect x="78" y="57" width="11" height="3" fill="#2A2521"/>
  </g>
</svg>
