<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!--
    The Egg (G-006). Enormous, round, serene, already decided. A boss-teal
    body inside a bone zona, ringed by a corona of blunt radiating cells, no
    two the same length. A small face set off-centre and too low: half-
    lidded, eyes cast down, a short flat mouth. It is not looking at you
    (law 8); it is deciding whether you exist.

    The boss carries the full register (D-018): a halftone shadow on the
    lower right, a screened nucleus, a flat gleam, and the body's fill
    printed slightly off its ink line (misregistration).

    Body is boss teal (G-031); gold is the projectile's and appears nowhere
    here. Teal sits close to the act background in lightness, so bone and
    ink carry the contrast. The corona is radial fingers, not lobes: the
    scalloped blot is the white cell's (CONCEPTION-ROSTER section 2).
    CONFORM adds the outline; there is none here.
    Colours: threat-boss #2F7370, bone #D2C6AC, ink #2A2521,
    conception-mid #A86A63.
  -->
