<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    The player, as a sperm (G-003). A comet: the School player's head, face
    and one cowlick, unchanged, on a short fat tail curled down and back
    under the head. Facing right (ActScene flips it for left). Paper, so it
    is the lightest body on the field and never the rival, which is bone
    with no cowlick (law 10). The face and cowlick are the School drawing's
    own paths, translated as one group 3 units ahead of the head's centre so
    the comet has a front. CONFORM adds the outline; there is none here.
    crispEdges stops anti-aliased edges quantising to stray colours.
    Colours are palette hex values: paper #EFE7D6, bone #D2C6AC, ink #2A2521.
  -->
  <g shape-rendering="crispEdges">
  <!-- tail: leaves the back of the head, curls under, flicks up at the tip -->
  <path d="M32,54 C30,66 26,75 19,79 C14,82 9,81 6,77 C4.5,75 2,75.5 2.5,78.5 C4,86 12,91 21,90 C32,89 41,81 48,68 Z" fill="#EFE7D6"/>
  <!-- tail underside, the second flat tone -->
  <path d="M2.5,78.5 C4,86 12,91 21,90 C32,89 41,81 48,68 L45,67.5 C38.5,78.5 30.5,85.5 21,86 C13,86.5 7,83.5 3,79.5 Z" fill="#D2C6AC"/>
  <g transform="translate(11,0)">
  <!-- cowlick: one tuft, above the left eye; School's path exactly -->
  <path d="M38,20 C40.2,16 41,12 41,8 L40.8,3.5 Q41.2,0.8 42.4,0.5 Q43.8,1 44,3.5 L43.6,8 C43.6,12 44.6,16 47,20 Z" fill="#EFE7D6"/>
  </g>
  <!-- head: School's radius -->
  <circle cx="58" cy="42" r="29" fill="#EFE7D6"/>
  <g transform="translate(11,0)">
  <!-- face, School's exactly: two tall dots, a short flat mouth under the
       left eye, and the small tick beside it. Deadpan. -->
  <ellipse cx="43.5" cy="44" rx="3.2" ry="9.5" fill="#2A2521"/>
  <ellipse cx="56.5" cy="44" rx="3.2" ry="9.5" fill="#2A2521"/>
  <rect x="42" y="60.5" width="8.5" height="2.2" fill="#2A2521"/>
  <rect x="38.6" y="57.8" width="1.8" height="4.9" fill="#2A2521"/>
  </g>
  </g>
</svg>
