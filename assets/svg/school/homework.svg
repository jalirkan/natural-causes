<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" shape-rendering="crispEdges">
  <!--
    Homework (SCHOOL-ROSTER §3.3). A leaning stack of paper seen from the
    side: triangular in profile, wide at the bottom, tapering to the top and
    leaning right past its own base. Deliberately not a rectangle — the
    bright hard rectangle is the substitute's (§1). Wads of sheets in bone,
    never paper; the stack's body shows through in shadow where the sheets
    do not line up. Two dots near the top, no mouth. CONFORM adds the
    outline; there is none here.
    Colours are palette hex values: bone #D2C6AC, shadow #6E6353, ink #2A2521.
  -->
  <!-- the stack's body, seen through the gaps -->
  <path d="M6 88 L12 82 L18 73 L25 64 L33 55 L43 45.5 L53 33 L56 29 L85 29 L89 33 L90 45 L89 55 L86 64 L82 73 L82 82 L79 88 Z" fill="#6E6353"/>
  <!-- wads of sheets, bottom to top -->
  <rect x="3" y="83" width="77" height="7" rx="2.5" fill="#D2C6AC" transform="rotate(-1.5 41.5 86.5)"/>
  <rect x="10" y="74" width="74" height="6.5" rx="2.5" fill="#D2C6AC" transform="rotate(2.5 47 77.25)"/>
  <rect x="15" y="65" width="67" height="6.5" rx="2.5" fill="#D2C6AC" transform="rotate(-2.5 48.5 68.25)"/>
  <rect x="24" y="56" width="64" height="6.5" rx="2.5" fill="#D2C6AC" transform="rotate(3 56 59.25)"/>
  <rect x="32" y="47" width="57" height="6.5" rx="2.5" fill="#D2C6AC" transform="rotate(-2 60.5 50.25)"/>
  <!-- the wad that carries the face -->
  <rect x="42" y="33" width="48" height="11.5" rx="3" fill="#D2C6AC" transform="rotate(2 66 38.75)"/>
  <!-- the top sheet, its left end curling up off the pile -->
  <path d="M86 25.5 L86 30.5 L62 30.5 C57 30.5 53 28.5 50.5 24 L54.5 22 C56.5 24.8 59 25.5 62 25.5 Z" fill="#D2C6AC"/>
  <!-- face: two dots, no mouth -->
  <circle cx="63" cy="38.5" r="4" fill="#2A2521"/>
  <circle cx="77" cy="39" r="4" fill="#2A2521"/>
</svg>
