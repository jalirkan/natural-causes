<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" shape-rendering="crispEdges">
  <!--
    Homework (SCHOOL-ROSTER §3.3). A leaning stack of paper seen from the
    side: triangular in profile, wide at the bottom, tapering to the top and
    leaning right past its own base. Deliberately not a rectangle — the
    bright hard rectangle is the substitute's (§1). Wads of sheets in bone,
    never paper; the stack's body shows through in shadow where the sheets
    do not line up. Two dots near the top, no mouth. CONFORM adds the
    outline; there is none here.
    Colours are palette hex values: bone #D2C6AC, shadow #6E6353, ink #2A2521.
  -->
  <!-- the stack's body, seen through the gaps -->
  <path d="M7 87 L10.5 81.5 L16.5 72.5 L25.5 63.5 L34.5 54.5 L45.5 45.5 L58 31.5 L60 29 L88 29 L89 31.5 L86 45.5 L87 54.5 L82 63.5 L80 72.5 L77 81.5 L74 87 Z" fill="#6E6353"/>
  <!-- wads of sheets, bottom to top -->
  <rect x="3" y="83.5" width="75" height="6.5" rx="2.5" fill="#D2C6AC" transform="rotate(-1.5 40.5 86.5)"/>
  <rect x="10" y="74.5" width="72" height="5.5" rx="2.5" fill="#D2C6AC" transform="rotate(2.5 46 77.25)"/>
  <rect x="16" y="65.5" width="65" height="5.5" rx="2.5" fill="#D2C6AC" transform="rotate(-2.5 48.5 68.25)"/>
  <rect x="25" y="56.5" width="66" height="5.5" rx="2.5" fill="#D2C6AC" transform="rotate(3.5 58 59.25)"/>
  <rect x="34" y="47.5" width="54" height="5.5" rx="2.5" fill="#D2C6AC" transform="rotate(-2 61 50.25)"/>
  <!-- the wad that carries the face -->
  <rect x="45" y="33" width="47" height="11.5" rx="3.5" fill="#D2C6AC" transform="rotate(1 68.5 38.75)"/>
  <!-- the top sheets, lying askew -->
  <rect x="57" y="25" width="34" height="5.5" rx="2" fill="#D2C6AC" transform="rotate(-3.5 74 27.75)"/>
  <!-- face: two dots, no mouth -->
  <rect x="61.6" y="34.6" width="8.4" height="8.6" rx="3.2" fill="#2A2521"/>
  <rect x="76.2" y="34.6" width="8.0" height="8.6" rx="3.2" fill="#2A2521"/>
</svg>
